source: Read out of the eight Diebold Nixdorf OpenAPI definitions published through the SwaggerHub organization
  Diebold-Nixdorf. Every entry below points at the exact place in a contract that carries the signature; nothing
  is taken from a marketing claim, because no Diebold Nixdorf developer documentation site is publicly reachable
  to make one.
cross_cutting:
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme is declared in any of the eight specifications. Bearer tokens are issued by
    vendor endpoints (GET /getToken, POST /tm-authorization/authenticate, GET|POST /token) rather than by an OAuth
    2.0 authorization server described in the contract.
- id: oidc
  conforms: true
  evidence: openapi/diebold-dn-payment-initiation-api-openapi.yml declares components.securitySchemes.openId of
    type openIdConnect with openIdConnectUrl https://login.microsoftonline.com/52846f0f-bc96-4a36-939b-f4d04bb473a0/v2.0/.well-known/openid-configuration,
    which returns HTTP 200 and is saved at well-known/diebold-openid-configuration.json. openapi/diebold-dn-secure-business-processing-api-openapi.yml
    states in info.description that authorization takes place via an external OpenID provider configured in the
    OCM configuration, expecting the OpenID access token in Authorization and the ID token in a separate parameter.
- id: rfc9457
  conforms: false
  evidence: All 248 4xx/5xx response bodies across the eight specifications are application/json carrying a vendor
    error object; application/problem+json appears nowhere. See errors/diebold-problem-types.yml.
- id: idempotency
  conforms: partial
  evidence: 'Two of 116 mutating operations state an idempotence key: openapi/diebold-dn-payment-initiation-api-openapi.yml
    paths./payments/{merchantId}/{transactionId}.delete and .put both carry "Idempotence key: transactionId" in
    the operation description. No Idempotency-Key header exists. See conventions/diebold-conventions.yml idempotency.coverage:
    partial.'
- id: pagination
  conforms: false
  evidence: No page, cursor, offset, limit or pageSize parameter is declared in any specification; collection reads
    are bounded by date range instead.
- id: json-api
