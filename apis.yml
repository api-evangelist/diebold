aid: diebold
url: https://raw.githubusercontent.com/api-evangelist/diebold/refs/heads/main/apis.yml
name: Diebold Nixdorf
description: 'Diebold Nixdorf is a global provider of connected commerce technology for the financial and retail
  industries — ATMs and self-service terminals, retail point-of-sale hardware, the Vynamic software portfolio (Payments,
  Transaction Middleware, Self-Service, Security, Retail Platform) and the managed services around them. Its integration
  surface is enterprise and customer-deployed rather than self-serve: eight public OpenAPI definitions for the Vynamic
  banking stack are published through the company''s SwaggerHub organization, while the Vynamic Retail Platform
  developer portal sits behind a login and the former developer community no longer resolves. There is no public
  signup, pricing page or published rate limit, and every specification names a customer-hosted server.'
deliveryModel:
  model: self-hosted
  open_source: false
  commercial: true
  callable_host: false
  label: Customer-deployed · you run their software in your own environment
  confidence: high
  source:
  - openapi
  - pricing
  - documentation
  generated: '2026-09-06'
  method: derived
  note: All eight published OpenAPI definitions name localhost:8080 in servers[]. Vynamic Transaction Middleware
    is licensed software installed in the financial institution's environment; there is no multi-tenant Diebold
    Nixdorf endpoint to call.
accessModel:
  pricing: enterprise
  onboarding: sales
  trial: false
  try_now: false
  public: false
  label: Enterprise licence, sales-gated
  confidence: high
  source:
  - pricing
  - authentication
  - documentation
  generated: '2026-09-06'
  method: derived
  note: No pricing page, no developer signup and no sandbox. Every product page routes to the "Let's Connect" contact
    form; the specifications are readable in the SwaggerHub registry but the credentials and the deployment come
    from a customer or partner agreement.
