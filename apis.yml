x-base-url-finding:
  checked: '2026-09-06'
  verdict: no-usable-base
  tool: repair-api-bases.py
  tool_nomination: https://virtserver.swaggerhub.com/Diebold-Nixdorf/dn_pledge_api/3.1.0
  accepted: false
  reason: The tool returns `disagreement` and would nominate a SwaggerHub auto-generated MOCK, not a Diebold Nixdorf
    host. It is deliberately not written into any baseURL. Every other candidate is localhost:8080 — the customer-deployment
    placeholder Diebold Nixdorf publishes because Vynamic Transaction Middleware runs inside the bank. Each apis[]
    entry therefore carries a templated {customer-host} base preserving the provider's own published path prefix,
    plus an x-base-url note; no real host is invented.
