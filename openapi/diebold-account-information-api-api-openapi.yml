components:
  schemas:
    AccountAmountType:
      type: string
      enum:
      - LEDGER_BALANCE
      - AVAILABLE_BALANCE
      - AVAILABLE_CREDIT
      - CREDIT_LIMIT
      - OVERDRAFT_LIMIT
      - LOAN_BALANCE
      - INTEREST_AMOUNT
      - REGULAR_PAYMENT_AMOUNT
      - REGULAR_PAYMENT_DUE
      - PRINCIPLE_BALANCE
      - CURRENT_AMOUNT_DUE
      - LAST_PAYMENT_AMOUNT
      - LAST_CHARGE_DUE
      - INTEREST_PAID_YEAR_TO_DATE
      - INTEREST_PAID_PREVIOUS_YEAR_TO_DATE
      - OFF_HOST_DEBIT_AMOUNT
      - OFF_HOST_CREDIT_AMOUNT
      - TOTAL_DEBIT_AMOUNT
      - TOTAL_CREDIT_AMOUNT
      - PAYOFF_AMOUNT
      - OWING_AMOUNT
      - AMOUNT_ALREADY_DRAWN_ON
      - MEMBER_PROVIDED_FEE_AMOUNT
      - REMAINING_PREAUTHORIZED_AMOUNT
      - HEALTHCARE_ELIGIBILITY_AMOUNT
      - PRESCRIPTION_ELIGIBILITY_AMOUNT
      - PREPAID_ONLINE_BILL_PAY_FEE_AMOUNT
      - CASH_BACK
      - ORIGINAL_AMOUNT
      - POI_AMOUNT
      - CO_PAY_AMOUNT
      - MINIMUM_AMOUNT_DUE
      - REWARD_BALANCE
      - LAST_STATEMENT_BALANCE
      example: AVAILABLE_BALANCE
      description: Amount types for account
    AccountStatus:
      type: string
      description: The status of the account
      enum:
      - ACTIVE
      - APPROVED
      - CLOSED
      - DORMANT
      - PENDING_CLOSED
      - CHARGEOFF
      - INACTIVE
      - NON_ACCRUAL
      - MATURED
      - ESCHEAT
      - ASSUMED
      - LOAN_DENIED
      - ORIGINATING
      - REDEEMED
      - MATURED_NOT_REDEEMED
      - NO_DEBIT
      - NO_CREDIT
      - NO_POST
      - FROZEN_NON_ACCRUAL
      - CHARGEDOFF_NON_ACCRUAL
      - OCCUPIED
      - NOT_AVAILABLE
      - UNOCCUPIED
      - ACTIVE_NO_POD
      - DO_NOT_CLOSE_ON_ZERO_BALANCE
      - FROZEN_ACCRUAL
      - OPEN_PRIMARY_ACCOUNT
      - RESTRICTED_PRIMARY_ACCOUNT
      - RESTRICTED_TO_DEPOSIT
      - NOT_SPECIFIED
      example: ACTIVE
    AccountRef:
      type: object
      description: "The account on which the transaction is to be performed. \n"
      required:
      - accountNumber
      - accountType
      properties:
        accountNumber:
          description: Account number
          type: string
          minLength: 1
          example: A0123456789
        accountType:
          $ref: '#/components/schemas/AccountType'
        accountName:
          $ref: '#/components/schemas/AccountName'
        accountSubType:
          $ref: '#/components/schemas/AccountSubType'
    Amounts:
      type: array
      items:
        $ref: '#/components/schemas/AccountAmount'
    AdditionalProperties:
      type: object
      additionalProperties:
        type: string
      description: Additional properties can be provided within this object
    getAccountWarningsResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            required:
            - accountWarnings
            - isBankEmployee
            properties:
              accountWarnings:
                type: array
                items:
                  $ref: '#/components/schemas/Warning'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    updateAccountNickNameRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionBase'
        payload:
          type: object
          required:
          - accountRef
          - accountName
          properties:
            consumerId:
              $ref: '#/components/schemas/ConsumerId'
            card:
              $ref: '#/components/schemas/CardPan'
            pin:
              $ref: '#/components/schemas/Pin'
            accountRef:
              $ref: '#/components/schemas/AccountRef'
            accountName:
              type: string
              minLength: 1
              example: SAVINGS
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    NetworkId:
      type: string
      description: Id of the acquiring network (scheme specific)
      example: MAC
    MerchantCategory:
      type: string
      description: Identifier representing the merchant's type of business product or service
      example: '6011'
    getAccountWarningsRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionBase'
        payload:
          type: object
          required:
          - accountRef
          properties:
            accountRef:
              $ref: '#/components/schemas/AccountRef'
            consumerId:
              $ref: '#/components/schemas/ConsumerId'
            card:
              $ref: '#/components/schemas/CardPan'
            pin:
              $ref: '#/components/schemas/Pin'
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    transactionConfirmationResponseUpdatedBalance:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            properties:
              confirmationNumber:
                $ref: '#/components/schemas/ConfirmationNumber'
              hostResponseData:
                $ref: '#/components/schemas/HostResponseData'
              accountDetails:
                $ref: '#/components/schemas/AccountInformationBase'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    Card:
      type: object
      required:
      - pan
      properties:
        pan:
          type: string
          minLength: 1
          description: Card number of the consumer
          example: '4512665599887762'
        cardState:
          type: string
          description: Defines the state of the card (Active, Blocked etc)
          enum:
          - ACTIVE
          - CLOSED
          - EXPIRED
          - BLOCKED
          - ISSUED
          - HOTCARD
        cardStateReasonCode:
          type: string
          description: Card State Reason Code
          enum:
          - LOST
          - STOLEN
          - EXPIRED
          - DAMAGED
          - SUSPECTED_FRAUD
          - FRAUD
          - CLOSED_BY_CUSTOMER
          - AUTOMATIC_AGREEMENT_COPY
          - DO_NOT_HONOUR
        cardStateReasonDescription:
          type: string
          description: Card State Reason Description
          example: Activate Card
    ExtendedResponseCode:
      type: string
      enum:
      - OK
      - SERVER_FAILURE
      - NO_RESULT
      - ACCOUNT_NOT_FOUND
      - ACCOUNT_CLOSED
      - ACCOUNT_TYPE_INVALID
      - LIMIT_EXCEEDED
      - INSUFFICIENT_FUNDS
      - REQUEST_DATA_INVALID
      - TRX_NOT_PERMITTED_TO_ACCOUNT
      - TRANSACTION_NOT_POSSIBLE
      - HOST_OFFLINE
      - HOST_CANCEL
      - HOST_BUSINESS_ERROR
      - RESPONSE_FEE_CONFIRM_REQUIRED
      - OVERDRAFT_CONFIRM_REQUIRED
      - PIN_VALIDATION_FAILED
      - FCC_CONFIRM_REQUIRED
      - DIRECT_CURRENCY_CONVERSION_CONFIRM_REQUIRED
      - MULTI_CONFIRM_REQUIRED
      - CARD_NOT_FOUND
      - CARD_NOT_FOUND_FOR_EXPIRY_DATE
      - CARD_BLOCKED
      - CARD_EXPIRED
      - CARD_MANIPULATED
      - PIN_INACTIVE
      - PIN_TRY_LIMIT_EXCEEDED
      - PINS_DIFFER
      - OFFLINE_OKAY
      - SERVER_NOT_READY
      example: OK
      description: Extended Response Code Mapping
    Address:
      type: object
      properties:
        street:
          type: string
          description: The name of the street.
          example: Mainstreet
        streetno:
          type: string
          description: The street number of this address.
          example: '119'
        city:
          type: string
          description: The name of the city.
          example: New York City
        zipcode:
          type: string
          description: The zip code of this city.
          example: N5467
        countrycode:
          type: string
          description: Country code
          example: USA
    getAccountStopHoldResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            required:
            - accountHoldList
            properties:
              accountHoldList:
                type: array
                items:
                  $ref: '#/components/schemas/AccountHold'
              accountStopPaymentList:
                type: array
                items:
                  $ref: '#/components/schemas/AccountStop'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    ClientType:
      type: string
      description: The type of the hardware terminal device
      enum:
      - ADMINISTRATIVE_TERMINAL
      - POS_TERMINAL
      - ATM
      - HOME_TERMINAL
      - ECR
      - DIAL_TERMINAL
      - TRAVELERS_CHECK_MACHINE
      - FUEL_MACHINE
      - SCRIP_MACHINE
      - COUPON_MACHINE
      - TICKET_MACHINE
      - POINT_OF_BANKING_TERMINAL
      - TELLER
      - FRANCHISE_TELLER
      - PERSONAL_BANKING
      - PUBLIC_UTILITY
      - VENDING
      - SELF_SERVICE
      - AUTHORIZATION
      - PAYMENT
      - VRU
      - SMART_PHONE
      - INTERACTIVE_TELEVISION
      - PERSONAL_DIGITAL_ASSISTANT
      - SCREEN_PHONE
      - INTERNET_TERMINAL
      - MICR_TERMINAL
      - MOBILE_ACCEPTANCE_SOLUTION
      - UNKNOWN
      - NOT_CARDHOLDER_ACTIVATED
      - LEVEL_1_CAT_ATM_WITH_PIN
      - LEVEL_2_CAT_SELF_SERVICE_TERMINAL
      - LEVEL_3_CAT_LIMITED_AMOUNT_TERMINAL
      - LEVEL_4_CAT_IN_FLIGHT_COMMERCE
      - LEVEL_6_CAT_ECOMMERCE
      - LEVEL_7_CAT_TRANSPONDER_TRANSACTION
      - LEVEL_8_CAT_MOBILE_INITIATED
      - LEVEL_9_CAT_MPOS_ACCEPTANCE_DEVICE
      example: ATM
    Amount:
      description: "The basic type of an amount. \nAlways an unsigned value. \nThe host must perform operations on this value as per the context of the transaction.\n\ne.g. \nFor a withdrawal transaction, the value must be debited, whereas for a deposit transaction, the value must be credited.\n"
      type: object
      required:
      - value
      - currency
      properties:
        value:
          description: The amount value of the given currency.
          type: string
          pattern: '[0-9]{1,13}\.[0-9]{1,3}'
