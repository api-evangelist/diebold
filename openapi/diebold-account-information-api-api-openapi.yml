    ClientTransactionTime:
      type: string
      description: 'In Local Timezone <br> For ''selfService'' channel, the local time the transaction takes place. <br><br>

        For ''network'' channel, data element DE12 - the local time the transaction takes place at the card acceptor location.'
      example: '164052'
    ConsumerId:
      type: string
      description: A unique identifier of a consumer
      example: '123456'
    AccountHoldResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            required:
            - confirmationNumber
            properties:
              confirmationNumber:
                allOf:
                - $ref: '#/components/schemas/ConfirmationNumber'
                description: The unique identifier for the hold created
              hostResponseData:
                $ref: '#/components/schemas/HostResponseData'
              accountDetails:
                $ref: '#/components/schemas/AccountInformationBase'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    HostResponseData:
      type: object
      description: Host Response details
      properties:
        hostResponseCode:
          type: string
          description: Host response code
          example: '00000'
        hostTransactionTime:
          type: string
          description: Host transaction datetime in milliseconds
          format: yyyy-MM-dd'T'HH:mm:ssZ
          example: 2020-09-01T16:40:52+0000
        hostMessage:
          type: string
          description: Host response message
          example: Success
    AccountScopeInformation:
      type: string
      description: The scope from where the the account list has to be returned in response
      enum:
      - INTERNAL
      - EXTERNAL
      example: INTERNAL
    ClientTransactionDate:
      type: string
      description: 'In Local Timezone <br> For ''selfService'' channel, the local month and day the transaction takes place. <br><br>

        For ''network'' channel, data element DE13 - the local month and day the transaction takes place at the card acceptor location.'
      format: MMDD
      example: 0921
    TransactionTypes:
      type: string
      enum:
      - sbLogin
      - sbLogout
      - sbRelogin
      - sbOpenConsumer
      - sbCardlessLogin
      - sbAccountMovement
      - sbAccountOverview
      - sbCheckCashing
      - sbDeposit
      - sbMixedMediaPayment
      - sbTransfer
      - sbWithdrawal
      - sbPinChange
      - sbPrestagedCashOut
      - sbPrestagedCashIn
      - sbEReceipt
      - sbLoadCustomerPreferences
      - sbSaveCustomerPreferences
      - sbAssistedWithdrawal
      - sbAssistedDeposit
      - sbLimitApproval
      - sbRequestSupport
      - sbCreditorSelection
      - withdrawal
      - balanceInquiry
      - transfer
      - purchase
      - deposit
      - payment
      - refund
      - purchaseCashback
      - cashDisbursement
      - consumerProfile
      - moneyTransferDebit
      - moneyTransferCredit
      - paymentDebit
      - paymentCredit
      - adjustmentDebit
      - adjustmentCredit
      - financialProfile
      - quasiCash
      - requestCurrencyExchangeRates
      description: Type of Transaction or BusinessCase performed
    getAccountListWarningsRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionBase'
        payload:
          type: object
          required:
          - accounts
          properties:
            consumerId:
              $ref: '#/components/schemas/ConsumerId'
            card:
              $ref: '#/components/schemas/CardPan'
            pin:
              $ref: '#/components/schemas/Pin'
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/AccountRef'
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    accountHoldRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionWithStandin'
        payload:
          type: object
          required:
          - amount
          - expiryDate
          - accountRef
          properties:
            card:
              $ref: '#/components/schemas/CardPan'
            pin:
              $ref: '#/components/schemas/Pin'
            accountRef:
              $ref: '#/components/schemas/AccountRef'
            amount:
              $ref: '#/components/schemas/Amount'
            fee:
              $ref: '#/components/schemas/TransactionFeeAmountOnly'
            expiryDate:
              $ref: '#/components/schemas/Date'
            expiryDateTime:
              $ref: '#/components/schemas/DateTime'
            effectiveDate:
              $ref: '#/components/schemas/Date'
            holdType:
              $ref: '#/components/schemas/HoldType'
            remark:
              type: string
              description: Transaction comments
              example: Hold for this account
            payeeName:
              type: string
              description: The name of the payee when the holdType is CHECK_HOLD
              example: Betty
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    BestMatchedElement:
      type: string
      example: TRACK_2
      description: Best matched element for Consumer Identification
      enum:
      - TRACK_2
      - NFC
      - EMV
      - CUSTOM
    getBusinessDateResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            required:
            - businessDate
            properties:
              businessDate:
                $ref: '#/components/schemas/Date'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    getCheckIssuerDetailsRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionBase'
        payload:
          type: object
          required:
          - check
          properties:
            check:
              $ref: '#/components/schemas/Check'
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    PointOfInteractionSettlementDate:
      type: string
      description: 'In Local Timezone <br> For ''selfService'' channel, ATM booking date for the transaction. <br><br>

        For ''network'' channel, data element DE15 - the  month and day funds are transferred between the acquirer and issuer.'
      format: MMDD
      example: 0921
    Payment:
      type: object
      description: Payment amounts to be represnted in amounts as REGULAR_PAYMENT_AMOUNT, REGULAR_PAYMENT_DUE, PRINCIPAL_BALANCE, PAYOFF_AMOUNT, LAST_PAYMENT_AMOUNT
      properties:
        regularPaymentDueDate:
          $ref: '#/components/schemas/Date'
        regularPaymentFrequency:
          type: string
          description: Regular payment frequency. This can be DAILY| MONTHLY|WEEKLY|YEARLY
          example: MONTHLY
        lastPaymentDate:
          $ref: '#/components/schemas/Date'
        paymentMethod:
          type: string
          description: The payment method of this account.
    AccountName:
      type: string
      description: The account name which is displayed to the user
      example: Your Savings account
    cancelAccountHoldRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionWithStandin'
        payload:
          type: object
          required:
          - holdId
          - accountRef
          properties:
            card:
              $ref: '#/components/schemas/CardPan'
            pin:
              $ref: '#/components/schemas/Pin'
            holdId:
              type: string
              description: The unique identifier used to identify the hold to be cancelled. This is the identifier received in accountHold API response as the confirmationNumber
              example: '998087999'
            cancelEffectiveDate:
              $ref: '#/components/schemas/Date'
            amount:
              $ref: '#/components/schemas/Amount'
            fee:
              $ref: '#/components/schemas/TransactionFeeAmountOnly'
            accountRef:
              $ref: '#/components/schemas/AccountRef'
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    IsStandin:
      type: boolean
      description: Standin request indicator
      example: false
    getScheduledTransactionsRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionBase'
        payload:
          type: object
          required:
          - accountRef
          properties:
            consumerId:
              $ref: '#/components/schemas/ConsumerId'
            card:
              $ref: '#/components/schemas/CardPan'
            pin:
              $ref: '#/components/schemas/Pin'
            accountRef:
              $ref: '#/components/schemas/AccountRef'
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    StopHoldType:
      type: string
      enum:
      - HOLD
      - STOP_PAYMENT
      example: HOLD
      description: Specifies if this is a hold or a stop payment
    CheckType:
      type: string
      enum:
      - ON_US
      - OFF_US
      - GOVERNMENT
      - NOT_SPECIFIED
      example: ON_US
      description: The Check Type value of the check
    AccountInformationBase:
      type: object
      required:
      - accountType
      - accountNumber
      - amounts
      properties:
        accountNumber:
          description: Account number
          type: string
          minLength: 5
          example: '19023456789'
        accountCurrency:
          description: Currency code
          type: string
          pattern: '[A-Z]{3,3}'
          example: USD
        accountType:
          $ref: '#/components/schemas/AccountType'
        accountSubType:
          $ref: '#/components/schemas/AccountSubType'
        accountName:
          $ref: '#/components/schemas/AccountName'
        instituteName:
          description: The name or identifier of the institute
          type: string
          example: Deutsche Bank
        effectiveDateTime:
          type: string
          description: The date and time stamp in UTC from which the balances specified in the 'amounts' property are effective
          format: yyyy-MM-dd'T'HH:mm:ssZ
          example: 2024-06-01T00:00:00+0000
        amounts:
          $ref: '#/components/schemas/Amounts'
    TransactionBase:
      type: object
      required:
      - id
      - type
      - operation
      properties:
        id:
          type: string
          minLength: 1
          example: '212423521525'
        transactionTime:
          type: string
          description: Transaction time
          format: yyyy-MM-dd'T'HH:mm:ssZ
          example: 2020-09-01T16:40:52+0000
        poiSettlementDate:
          $ref: '#/components/schemas/PointOfInteractionSettlementDate'
        businessCorrelationId:
          type: string
          description: Unique ID for a transaction business case
          maxLength: 50
          example: 7f2b9fcde28b42abbc10b0b9640f6ede
        type:
          $ref: '#/components/schemas/TransactionTypes'
        operation:
          type: string
          minLength: 1
          description: Operation performed for the given transaction type given by the 'type' property
        retrievalReferenceNumber:
          type: string
          example: '827364775848'
          description: 'A numeric value containing the unique transaction reference number '
        authorizationIdentificationResponse:
          type: string
          example: '000123'
          description: A numeric value containing the authorization code
    ConfirmationNumber:
      type: string
      description: The unique identifier for the transaction
      example: '998087999'
    ExtendedResponse:
      type: object
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/ExtendedResponseCode'
        message:
          $ref: '#/components/schemas/ExtendedResponseMessage'
    SupplementaryData:
      type: object
      description: 'Additional information incorporated as an extension to the message by mixins based on the transaction type          '
    CardHandlingIndicator:
      type: string
      enum:
      - OUT
      - RETAIN
      - CHAINING_ALLOWED
      - RETAIN_ON_SUCCESS
      description: Card Handling Indicator
      example: OUT
    EMVTagData:
      type: object
      properties:
        tag:
          $ref: '#/components/schemas/EMVTags'
        value:
          type: string
          description: Hex Encoded value of EMVTag
          example: 673336XXXXXXXXX1005D2005201XXXXXXXXXXF
    Loan:
      type: object
      description: Loan balance to be represented in amounts as LOAN_BALANCE, INTEREST_AMOUNT, REGULAR_PAYMENT_AMOUNT, REGULAR_PAYMENT_DUE, PRINCIPLE_BALANCE, MINIMUM_AMOUNT_DUE, LAST_PAYMENT_AMOUNT, LAST_CHARGE_DUE, INTEREST_PAID_YEAR_TO_DATE, INTEREST_PAID_PREVIOUS_YEAR_TO_DATE
      properties:
        loanType:
          $ref: '#/components/schemas/LoanType'
        loanMaturityDate:
          $ref: '#/components/schemas/Date'
    CardPan:
      type: object
      required:
      - pan
      properties:
        bestMatchedElement:
          $ref: '#/components/schemas/BestMatchedElement'
        pan:
          type: string
          minLength: 1
          description: Primary Account Number (PAN) of the card
          example: '4490739000000895'
        track2:
          type: string
          example: 4490739000000895D161222366
          description: ISO track 2 issued from the magnetic stripe card or from the ICC
        emvData:
          type: array
          items:
            $ref: '#/components/schemas/EMVTagData'
        cardSequenceNumber:
          type: string
          example: '05'
          description: Identify a card or a payment token inside a set of cards with the same PAN
        expiryDate:
          type: string
          description: Expiry date of the card expressed in YYMM format
          example: '2107'
        consumerGroup:
          type: string
          description: Consumer Group Name
          example: CG_ON_US_DEBIT
    Check:
      type: object
      required:
      - checkNumber
      properties:
        checkNumber:
          type: string
          example: '214214'
        micr:
          type: string
          example: 09879078
        checkType:
          $ref: '#/components/schemas/CheckType'
        bankRoutingId:
          type: string
          description: Contains the BIC (bank identifier code)
          example: '335668810'
        accountNumber:
          type: string
          description: Account Number
          example: '1248131234'
    TransactionResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/TransactionWithStandin'
      description: Exact replica of the request 'transaction' object which must be returned by the host
    getAccountListWarningsResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            required:
            - accountWarnings
            properties:
              accountInformationList:
                type: array
                items:
                  $ref: '#/components/schemas/AccountListWarning'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    AccountHold:
      type: object
      required:
      - id
      - effectiveDate
      - expiryDate
      - type
      - code
      - amount
      properties:
        id:
          type: string
          description: The unique identifier for the hold
          minLength: 1
          example: 123
        expiryDate:
          $ref: '#/components/schemas/Date'
        effectiveDate:
          $ref: '#/components/schemas/Date'
        type:
          $ref: '#/components/schemas/StopHoldType'
        code:
          type: string
          description: The code for this hold
          example: '1'
        amount:
          $ref: '#/components/schemas/Amount'
        description:
          type: string
          description: The description for the hold
          example: Hold for this account
    AccountPermissions:
      type: object
      properties:
        accessPermission:
          $ref: '#/components/schemas/AccessPermission'
        markedForDepositOnly:
          type: boolean
          example: false
          description: Flag to identify if the account is for Deposit only
    DateTime:
      type: string
      description: The date and time expressed in the pattern 'yyyy-MM-dd'T'HH:mm:ssZ', where yyyy is 4-digit year, MM is 2-digit month, dd is 2-digit date of month, HH is hours, mm is minutes and ss is seconds
      format: yyyy-MM-dd'T'HH:mm:ssZ
      example: 2020-07-23T12:00:00+0000
