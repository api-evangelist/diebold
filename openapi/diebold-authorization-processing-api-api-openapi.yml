        The host must operate on the accounts involved.

        - The fee (if applicable) must be credited in to the fee account.

        - For a deposit transaction :

        - the remaining validatedAmount must be credited into the specified account.

        - the check amounts must be debited from the check accounts and credited into the specified account.

        - For a split deposit transaction :

        - the specified amounts must be credited into the specified accounts.


        In case of a check deposit transaction, the check amount must be held till the checks are cleared by the clearing house.'
      requestBody:
