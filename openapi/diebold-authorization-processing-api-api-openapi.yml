  /withdrawalAuthorize:
    post:
      parameters:
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/initiatingPartyId'
      - $ref: '#/components/parameters/productName'
      - $ref: '#/components/parameters/initiatingPartyName'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/referenceId'
      - $ref: '#/components/parameters/authorization'
      summary: Authorizes a withdrawal transaction
      tags:
      - Authorization Processing API
      operationId: withdrawalAuthorize
      description: 'Posts details of the authorization of a withdrawal transaction. The host must authenticate and authorize the transaction and do necessary operation on the presented amount.

        Note: All amounts present in the request must be treated individually and they are exclusive of transaction fees. Fees, if present have to be additionally added to transaction amount while operating on account.


        Key scenarios associated with a withdrawal authorize transaction:


        - withdrawal without fee/FCC/DCC - There is no fee, FCC or DCC involved. The host must debit the specified amount from the specified account


        - withdrawal with fee - If fee is applicable and if confirmation is required (fees.type - DIRECT_ACQUIRER_FEE) from the consumer, a resubmit response is sent by the host in the first withdrawalAuthorize response. The consumer accepts/declines the fee in the subsequent withdrawalAuthorize request and the host processes the request considering the fee with the requested amount. If a fee is applicable but consumer confirmation is not required (fees.type - INDIRECT_ACQUIRER_FEE), the host must debit the fee and the specified amount without sending resubmit response.


        - withdrawal with FCC (Foreign Currency Conversion) - If FCC is available and a confirmation is required (foreignCurrencyConversion.fccState - CONFIRM_REQUIRED ) from the consumer, a resubmit response is sent by the host in the first withdrawalAuthorize response. The consumer accepts/declines the FCC in the subsequent withdrawalAuthorize request and the host processes the request. If FCC is available but consumer confirmation is not required (fccState - CONF_NOT_REQUIRED ) , the host must debit the specified amount in base currency without sending resubmit response.


        - withdrawal with DCC (Dynamic Currency Conversion) - If DCC is available, a confirmation is required (dynamicCurrencyConversion.mode - DCC_CURRENCY_AVAILABLE) from the consumer and, a resubmit response is sent by the host in the first withdrawalAuthorize response. The consumer accepts/declines the DCC in the subsequent withdrawalAuthorize request and the host processes the request as per the consumers response


        - withdrawal with a combination of fee/FCC/DCC - If fee, FCC and DCC are available in a combination (extendedResponse.code - MULTI_CONFIRM_REQUIRED), a resubmit response is sent by the host in the first withdrawalAuthorize response. The consumer accepts/declines the fee, FCC and/or DCC in the subsequent withdrawalAuthorize request and the host processes the request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/withdrawal.authorize.request'
            examples:
              WithdrawalAuthorizeRequestWithoutFee:
                $ref: '#/components/examples/WithdrawalAuthorizeRequestWithoutFee'
              WithdrawalAuthorizeRequestWithFeeConfirmed:
                $ref: '#/components/examples/WithdrawalAuthorizeRequestWithFeeConfirmed'
              WithdrawalAuthorizeRequestWithFCC:
                $ref: '#/components/examples/WithdrawalAuthorizeRequestWithFCC'
              WithdrawalAuthorizeRequestWithFCCAccepted:
                $ref: '#/components/examples/WithdrawalAuthorizeRequestWithFCCAccepted'
        description: "If payload encryption scheme is used, Request body will follow schema __EnvelopeRequest__. <br>Encryption algorithm: ECIES as in IEEE P 1363a<br><br> __Example Value:__<br>\n\n    {\n      \"envelope\": {\n        \"keyId\" : \"6K7FNu88LpwYucaZYJkb5snOYZkrruZhgGzq8OfmOE0\",\n        \"requestor\": \"Alpha.Farm.Cluster.TXMServer01\",\n        \"payload\": \"BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+\"\n      }\n    }\n\nIf payload encryption scheme is not used, Request body will follow schema as mentioned below"
      responses:
        '200':
          description: "If payload encryption scheme is used, Response body will follow schema __EnvelopeResponse__.<br>Encryption algorithm: ECIES as in IEEE P 1363a<br><br> __Example Value:__<br>\n\n      {\n        \"envelope\": {\n            \"keyId\" : \"7PFu8nPcrnSqJk-cXnX2XOkksxWJp0imi1PWUs74i38\",\n            \"payload\": \"WWabWIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPQRs+\"\n          }\n      } \nIf payload encryption scheme is not used, Response body will follow schema as mentioned below"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/withdrawal.authorize.response'
              examples:
                WithdrawalAuthorizeResponseWithoutFee:
                  $ref: '#/components/examples/WithdrawalAuthorizeResponseWithoutFee'
                WithdrawalAuthorizeResponseWithFee:
                  $ref: '#/components/examples/WithdrawalAuthorizeResponseWithFee'
                WithdrawalAuthorizeResponseWithFCCConfirmRequired:
                  $ref: '#/components/examples/WithdrawalAuthorizeResponseWithFCCConfirmRequired'
                WithdrawalAuthorizeResponseWithFCCConfirmNotRequired:
                  $ref: '#/components/examples/WithdrawalAuthorizeResponseWithFCCConfirmNotRequired'
        '400':
          description: Invalid input fields, object invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              examples:
                ServiceResponseFailExample:
                  $ref: '#/components/examples/ServiceResponseFailExample'
        '500':
          description: Error while performing operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              examples:
                ServiceResponseFailExample:
                  $ref: '#/components/examples/ServiceResponseFailExample'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
