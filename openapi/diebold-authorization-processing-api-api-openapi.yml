      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/initiatingPartyId'
      - $ref: '#/components/parameters/productName'
      - $ref: '#/components/parameters/initiatingPartyName'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/referenceId'
      - $ref: '#/components/parameters/authorization'
      summary: Authorizes a transfer transaction
      tags:
      - Authorization Processing API
      operationId: transferAuthorize
      description: 'Posts details of the authorization of a transfer transaction. The host must authenticate and authorize the transaction and do necessary operation on the presented amount.


        Key scenarios associated with a transfer authorize transaction:


        - transfer without fee/FCC - There is no fee or FCC involved. The host must transfer the specified amount from the source account to the target account


        - transfer with fee - If fee is applicable and a confirmation is required from the consumer, a resubmit response is sent by the host in the first transferAuthorize response. The consumer accepts/declines the fee in the subsequent transferAuthorize request and the host processes the request considering the fee with the requested amount. If a fee is applicable but consumer confirmation is not required, the host must debit the fee and the specified amount from the source account


        - transfer with FCC (Foreign Currency Conversion) - If FCC is available and a confirmation is required from the consumer, a resubmit response is sent by the host in the first transferAuthorize response. The consumer accepts/declines the FCC in the subsequent transferAuthorize request and the host processes the request. If FCC is available but consumer confirmation is not required, the host must transfer the specified amount in base currency


        - transfer with a combination of fee/FCC - If fee and FCC are available in a combination, a resubmit response is sent by the host in the first transferAuthorize response. The consumer accepts/declines the fee, FCC in the subsequent transferAuthorize request and the host processes the request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transfer.authorize.request'
            examples:
              TransferAuthorizeRequestWithoutFee:
                $ref: '#/components/examples/TransferAuthorizeRequestWithoutFee'
              TransferAuthorizeRequestWithFee:
                $ref: '#/components/examples/TransferAuthorizeRequestWithFee'
        description: "If payload encryption scheme is used, Request body will follow schema __EnvelopeRequest__. <br>Encryption algorithm: ECIES as in IEEE P 1363a<br><br> __Example Value:__<br>\n\n    {\n      \"envelope\": {\n        \"keyId\" : \"6K7FNu88LpwYucaZYJkb5snOYZkrruZhgGzq8OfmOE0\",\n        \"requestor\": \"Alpha.Farm.Cluster.TXMServer01\",\n        \"payload\": \"BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+\"\n      }\n    }\n\nIf payload encryption scheme is not used, Request body will follow schema as mentioned below\n "
      responses:
        '200':
          description: "If payload encryption scheme is used, Response body will follow schema __EnvelopeResponse__.<br>Encryption algorithm: ECIES as in IEEE P 1363a<br><br> __Example Value:__<br>\n\n      {\n        \"envelope\": {\n            \"keyId\" : \"7PFu8nPcrnSqJk-cXnX2XOkksxWJp0imi1PWUs74i38\",\n            \"payload\": \"WWabWIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPQRs+\"\n          }\n      } \nIf payload encryption scheme is not used, Response body will follow schema as mentioned below"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfer.authorize.response'
              examples:
                TransferAuthorizeResponseWithoutFee:
                  $ref: '#/components/examples/TransferAuthorizeResponseWithoutFee'
                TransferAuthorizeResponseWithFee:
                  $ref: '#/components/examples/TransferAuthorizeResponseWithFee'
        '400':
          description: Invalid input fields, object invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              examples:
                ServiceResponseFailExample:
                  $ref: '#/components/examples/ServiceResponseFailExample'
        '500':
          description: Error while performing operation
          content:
