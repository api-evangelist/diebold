components:
  schemas:
    AccountAmountType:
      type: string
      enum:
      - LEDGER_BALANCE
      - AVAILABLE_BALANCE
      - AVAILABLE_CREDIT
      - CREDIT_LIMIT
      - OVERDRAFT_LIMIT
      - LOAN_BALANCE
      - INTEREST_AMOUNT
      - REGULAR_PAYMENT_AMOUNT
      - REGULAR_PAYMENT_DUE
      - PRINCIPLE_BALANCE
      - CURRENT_AMOUNT_DUE
      - LAST_PAYMENT_AMOUNT
      - LAST_CHARGE_DUE
      - INTEREST_PAID_YEAR_TO_DATE
      - INTEREST_PAID_PREVIOUS_YEAR_TO_DATE
      - OFF_HOST_DEBIT_AMOUNT
      - OFF_HOST_CREDIT_AMOUNT
      - TOTAL_DEBIT_AMOUNT
      - TOTAL_CREDIT_AMOUNT
      - PAYOFF_AMOUNT
      - OWING_AMOUNT
      - AMOUNT_ALREADY_DRAWN_ON
      - MEMBER_PROVIDED_FEE_AMOUNT
      - REMAINING_PREAUTHORIZED_AMOUNT
      - HEALTHCARE_ELIGIBILITY_AMOUNT
      - PRESCRIPTION_ELIGIBILITY_AMOUNT
      - PREPAID_ONLINE_BILL_PAY_FEE_AMOUNT
      - CASH_BACK
      - ORIGINAL_AMOUNT
      - POI_AMOUNT
      - CO_PAY_AMOUNT
      - MINIMUM_AMOUNT_DUE
      - REWARD_BALANCE
      - LAST_STATEMENT_BALANCE
      example: AVAILABLE_BALANCE
      description: Amount types for account
    AccountStatus:
      type: string
      description: The status of the account
      enum:
      - ACTIVE
      - APPROVED
      - CLOSED
      - DORMANT
      - PENDING_CLOSED
      - CHARGEOFF
      - INACTIVE
      - NON_ACCRUAL
      - MATURED
      - ESCHEAT
      - ASSUMED
      - LOAN_DENIED
      - ORIGINATING
      - REDEEMED
      - MATURED_NOT_REDEEMED
      - NO_DEBIT
      - NO_CREDIT
      - NO_POST
      - FROZEN_NON_ACCRUAL
      - CHARGEDOFF_NON_ACCRUAL
      - OCCUPIED
      - NOT_AVAILABLE
      - UNOCCUPIED
      - ACTIVE_NO_POD
      - DO_NOT_CLOSE_ON_ZERO_BALANCE
      - FROZEN_ACCRUAL
      - OPEN_PRIMARY_ACCOUNT
      - RESTRICTED_PRIMARY_ACCOUNT
      - RESTRICTED_TO_DEPOSIT
      - NOT_SPECIFIED
      example: ACTIVE
    AccountRef:
      type: object
      description: "The account on which the transaction is to be performed. \n"
      required:
      - accountNumber
      - accountType
      properties:
        accountNumber:
          description: Account number
          type: string
          minLength: 1
          example: A0123456789
        accountType:
          $ref: '#/components/schemas/AccountType'
        accountName:
          $ref: '#/components/schemas/AccountName'
        accountSubType:
          $ref: '#/components/schemas/AccountSubType'
    Amounts:
      type: array
      items:
        $ref: '#/components/schemas/AccountAmount'
    Currency:
      description: Currency code
      type: string
      minLength: 3
      pattern: '[A-Z]{3,3}'
      example: USD
    AdditionalProperties:
      type: object
      additionalProperties:
        type: string
      description: Additional properties can be provided within this object
    DebitAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/Amount'
      description: The amount of the transaction to be debited from the consumer's account when the amount being paid is less than the payment amount being requested
    BaseCurrency:
      description: Currency code of the base currency
      type: string
      minLength: 3
      pattern: '[A-Z]{3,3}'
      example: USD
    FeeType:
      type: string
      enum:
      - DIRECT_ACQUIRER_FEE
      - INDIRECT_ACQUIRER_FEE
      - ISSUER_FEE
      - SPECIAL_FEE
      - SETTLEMENT_ACQUIRER_FEE
      - TELLER_MODIFIABLE_FEE
      - DCC_COMMISSION_FEE
      example: DIRECT_ACQUIRER_FEE
    CashInLimit:
      type: object
      allOf:
      - $ref: '#/components/schemas/Amount'
      description: Amount limit for cash in the transaction
    Device:
      type: object
      description: ATM Device
      required:
      - device
      properties:
        device:
          type: string
          description: Device id. For a list of all 185 possible devices please refer to - http://[xxx.xxx.xxx.xxx]/pce-manuals/ruegen/pdf25/KnowledgeBase/doc/content.html?url=content/html/KnowledgeBase_SRV/SEC_possible_devices.html&search=PCEDeviceConstant
          example: DOCUMENT_FEED
        deviceState:
          type: string
          description: State of Device OPERATIONAL or NON_OPERATIONAL
          example: OPERATIONAL
    checkcashing.authorizecashout.request:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionBase'
        payload:
          type: object
          properties:
            consumerId:
              $ref: '#/components/schemas/ConsumerId'
            card:
              $ref: '#/components/schemas/CardPan'
            emvRequest:
              type: array
              items:
                $ref: '#/components/schemas/EMVTagData'
            requestedAmount:
              $ref: '#/components/schemas/RequestedAmount'
            creditAmount:
              $ref: '#/components/schemas/CreditAmountCC'
            account:
              $ref: '#/components/schemas/AccountCC'
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    updateChecks.response:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            properties:
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    transfer.authorize.request:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionBase'
