      summary: Finalizes a pin change operation
      tags:
      - Authorization Processing API
      operationId: pinChangeFinalize
      description: 'Posts details of the finalization of a pinchange operation as per the accountingState.


        If the accountingState is OK, the transaction is successful. Else, a reversal is triggered.


        The host must perform reversal of the pin change operation in case of failure and ensure that the previous pin is recoverable.

        The previous pin must be restored.'
