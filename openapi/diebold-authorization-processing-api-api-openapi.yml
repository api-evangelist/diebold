  /withdrawalFinalize:
    post:
      parameters:
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/initiatingPartyId'
      - $ref: '#/components/parameters/productName'
      - $ref: '#/components/parameters/initiatingPartyName'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/referenceId'
      - $ref: '#/components/parameters/authorization'
      summary: Finalizes a withdrawal transaction
      tags:
      - Authorization Processing API
      operationId: withdrawalFinalize
      description: 'Posts details of the finalization of a withdrawal transaction as per the accountingState.


        If the accountingState is OK, the transaction is successful. Else, a reversal is triggered.


        The host must perform reversal operations on all the accounts where operations were performed in the authorize step.


        The ''amount'' attribute represents the dispensed amount. In case of a partial dispense, the host must perform a reversal of the undispensed amount.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/withdrawal.finalize.request'
