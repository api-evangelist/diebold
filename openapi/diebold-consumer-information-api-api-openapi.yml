    ClientTransactionTime:
      type: string
      description: 'In Local Timezone <br> For ''selfService'' channel, the local time the transaction takes place. <br><br>

        For ''network'' channel, data element DE12 - the local time the transaction takes place at the card acceptor location.'
      example: '164052'
    IsStandin:
      type: boolean
      description: Standin request indicator
      example: false
    ExtendedResponseMessage:
      type: string
      description: Extended Response Message
      example: OK
    PreferenceScope:
      type: string
      description: The scope for the list of customer preferences
      example: FastCash
    ConsumerId:
      type: string
      description: A unique identifier of a consumer
      example: '123456'
    ConsumerPreferences:
      type: object
      description: Consumer preferences containing preferences for a specific scope
      required:
      - scope
      - entries
      properties:
        scope:
          $ref: '#/components/schemas/PreferenceScope'
        entries:
          type: array
          description: "\nList of preferences in the key-value-type format. \n\n**key** - mandatory field of *string* type that indicates the name of the preference\n\n**value** - mandatory field of any data type containing the value of this preference\n\n**type** - mandatory field of *string* type indicating the data type of 'value' field. It is an enum containing the below values.\n\n    - Long\n    - Boolean\n    - String\n    - Integer\n    - Double\n    - BigInteger\n    - BigDecimal\n    - HashMap\n    - ArrayList\n    \n"
          items:
            type: object
            additionalProperties: true
          example:
          - key: Language
            value: en-US
            type: String
          - key: Print receipt
            value: true
            type: Boolean
          - key: FastCash amount
