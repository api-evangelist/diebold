        recurrenceType:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
          description: The recurrence of a standing order transaction defines the execution frequency regarding the next possible
            transactions.
          example: MONTHLY
        startDate:
          $ref: '#/components/schemas/OmapiDate'
        endAfter:
          type: string
          description: This string can contain different values:<br> 1.) The parameter contains "NO_END". In this case the
            execution will happen as long as the standing order exists. Pay attention to the capitalization! 2.) The parameter
            contains a positive and integer number. The standing order is executed as often as defined by this positive, integer
            number in the parameter "endAfter". 3.) The parameter conatins a values which matches a date with the pattern
            like '([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))'. In this case the date defines the latest execution date.
          example: '1'
