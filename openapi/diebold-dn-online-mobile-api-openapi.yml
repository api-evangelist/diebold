  /executePrestagedTransaction:
    post:
      tags:
      - Prestaged Transaction API
      summary: Execute a prestaged transaction at an ATM with an accessCode.
      description: "Execute a prestaged transaction at an ATM with an accessCode. When the customer creates a prestaged transaction\
        \  or receives an accessCode from a third party member, the transaction (deposit/withdrawal)  tied to that accessCode\
        \ can be executed contact-less at an ATM supporting the feature. The ATM presents a  QR-Code that must be scanned\
        \ by the mobile application. It contains a JSON Web Token (JWT) with information  like the ATM's __nodeId__ and a\
        \ __tokenUUID__ which both have to be provided in the request together with the  __accessCode__ (see __ExecutePrestagedTransactionRequestPayload__).\n\
        \nWhen two-step-verification is enabled (via OCM) the first request is denied with a  RESUBMIT / TWO_STEP_ATM_VALIDATION_REQUIRED\
        \ response. The ATM will flash lights or play a sound to indicate  that the transaction is going to be executed at\
        \ the ATM next to the customer. The customer then verifies by  setting the __additionalSecurity__ property to true.\
        \ Ideally the customer is guided through the process by his mobile banking application.\n### Example Response: \n\n\
        \    {\n        \"responseStatus\": {\n            \"success\": true,\n            \"error\": null               \
        \       \n        }\n    }"
      operationId: executePrestagedTransaction
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      - $ref: '#/components/parameters/bankCodeParam'
      requestBody:
        $ref: '#/components/requestBodies/executePrestagedTransactionRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/executePrestagedTransactionResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
