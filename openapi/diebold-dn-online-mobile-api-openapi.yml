      description: Schema to easily generate a crypto payload for /getLocations requests.
      properties:
        latitude:
          type: number
          format: double
          description: 'The latitude of the location. Format: DD.dddd. Range form -90.0000 to +90.0000'
          example: 51.367
        longitude:
          type: number
          format: double
          description: 'The longitude of the location. Format: DDD.dddd. Range form -180.0000 to +180.0000'
          example: 12.4815
        radius:
          type: integer
          minimum: 0
          maximum: 1000
          description: The radius in kilometer to search for locations.
          example: 15
        wkstStates:
