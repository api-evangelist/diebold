      description: "Delete a standing order with the given __referenceID__ (see __referenceIdParam__).\n### Example Response:\
        \ \n\n    {\n        \"responseStatus\": {\n            \"success\": true,\n            \"error\": null          \
        \            \n        }\n    }"
      operationId: deleteStandingOrder
      parameters:
