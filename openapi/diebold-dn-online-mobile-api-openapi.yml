      description: 'Schema to easily generate a crypto payload for /createStandingOrder and /updateStandingOrder requests.

        The __createTransferRequest__ property uses the same schema as the __CreateTransferRequestPayload__ but should be
        used __unencrypted__ in this context. It will be encrypted with the __StandingOrderRequestPayload__.'
