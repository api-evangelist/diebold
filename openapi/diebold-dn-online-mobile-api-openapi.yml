          type: string
          description: This string is used - __if set__ - to send an initial message to the customers phone, right after receiving
            the registerForRemoteNotifications call.<br>
          example: Welcome to your Mobile Banking Demo App. We'll keep you informed regarding important events of your account.
        locale:
          type: string
          minLength: 2
          description: 'An ISO 639 alpha-2 or alpha-3 language code maybe with an appended "-" or "_" and an ISO 3166 alpha-2
            or alpha-3 country code. Example: de_DE, en_US

            '
