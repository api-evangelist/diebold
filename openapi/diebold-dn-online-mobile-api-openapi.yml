    ExecutePrestagedTransactionRequestPayload:
      type: object
      required:
      - nodeId
      - accessCode
      - tokenUUID
      description: Schema to easily generate a crypto payload for /executePrestagedTransaction requests.
      properties:
        businessCorrelationId:
          $ref: '#/components/schemas/BusinessCorrelationId'
        tokenUUID:
          type: string
          minLength: 1
          description: The tokenUUID of the QR-Code encoded JWT that is scanned from the ATM. The tokenUUID resides in the
            JWT's claimSet as __tokenClaim__.
          example: 6d1b8551-6e7b-49c1-a540-00b0b8fc8a15
        nodeId:
          type: string
          minLength: 1
          description: The nodeId of the device where the QR-Code encoded JWT was obtained from. The nodeId resides in the
            JWT's claimSet as __nodeIdClaim__.
          example: 273645
        accessCode:
          type: string
          minLength: 1
          description: The accessCode that was provided in the response when the prestaged transaction was created.
          example: 6680
        latitude:
          type: string
          minLength: 1
          pattern: ^[+-]?(([1-8]\d|[0-9])(\.\d{1,6})?|90(\.0{1,6})?)$
          description: 'Optional latitude of the customer''s location when executing the prestaged transaction. Valid range:
            -90 to +90 degrees with up to 6 decimal places (e.g. 51.367000).'
          example: '51.367000'
        longitude:
          type: string
          minLength: 1
          pattern: ^[+-]?((1[0-7]\d|[1-9]\d|[0-9])(\.\d{1,6})?|180(\.0{1,6})?)$
          description: 'Optional longitude of the customer''s location when executing the prestaged transaction. Valid range:
            -180 to +180 degrees with up to 6 decimal places (e.g. 12.481500).'
          example: '12.481500'
        additionalSecurity:
          type: boolean
          description: When additionalSecurity is used (true) the ATM which provided the QR-Code encoded JWT will make itself
            recognizable to the customer according to it's capabilities e.g. blink indicator lights or play audible sounds.
            The parameter is optional but may be required from the server side with an appropriate response.
        SupplementaryData:
          $ref: '#/components/schemas/OmApiSupplementaryData'
    GetLocationsRequestPayload:
      type: object
      required:
