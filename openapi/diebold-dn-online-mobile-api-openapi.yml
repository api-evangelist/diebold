      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      requestBody:
        $ref: '#/components/requestBodies/createCashout2YouRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/createCashout2YouResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /createDeposit:
    post:
      tags:
      - Prestaged Transaction API
      summary: Create a prestaged cashin/deposit transaction request.
      description: "## Creating a prestaged cashin/deposit transaction request.\nThe __/createDeposit__ endpoint expects only\
        \ one required property - besides the credentials - to form a valid request. The __targetAccount__ property is used\
        \ to designate where the deposited money should be transferred. The optional __amount__ property is not required because\
        \ the general assumption is that ahead of time, nobody knows which amount will be deposited. The currency for the\
        \ deposited amount defaults to a configurable value on the server side, e.g. __USD__.\n\nIf the __targetAccount__\
        \ is a foreign currency account the optional __amount__ property should be used to designate the foreign currency,\
        \ e.g. __EUR__. The __amount__ property's value cannot be __null__ but any other string encoded value like __\"20.00\"\
        __ suffices to pass schema validation.\n\n    \"amount\": {\n        \"value\": \"20.00\",\n        \"currency\":\
        \ \"EUR\"\n    }\n\nIn the server's response the amount will have the same value except for split deposits.\n## Split\
        \ deposits\nThe pupose of split depoits is to transfer funds on different accounts owned by the client in one transaction.\
        \ The intention to create a split deposit is indicated by the presence of the __splitData__ porperty in the request.\
        \ The property is an array of __AccountWithAmount__ objects, each containg a __ShortAccountInfo__ and an __Amount__\
        \ object. They are not limited in numbers and may not contain negative amounts. When the transaction is executed the\
        \ splits are handled first and in the order they were defined. See the following request body as example.\n### Example:\
        \ default currency split request\n\n    {\n        \"targetAccount\": {\n            \"accountNumber\": \"78001\"\
        ,\n            \"accountType\": \"CHECKING\",\n            \"bankCode\": \"12345678\"\n        },\n        \"splitData\"\
        : [\n            {\n                \"account\": {\n                    \"accountNumber\": \"780015\",\n         \
        \           \"accountType\": \"CHECKING\"\n                },\n                \"amount\": {\n                   \
        \ \"value\": \"30.00\",\n                    \"currency\": \"USD\"\n                }\n            },\n          \
        \          {\n                \"account\": {\n                    \"accountNumber\": \"888805\",\n               \
        \     \"accountType\": \"CHECKING\"\n                },\n                \"amount\": {\n                    \"value\"\
        : \"20.00\",\n                    \"currency\": \"USD\"\n                }\n            }\n        ]\n    }\n\nFor\
        \ the __targetAccount__ as in the previous example we don't need to specify an amount. The default currency will be\
        \ used. This does not apply to the split amounts. The client must provide value and currency since he wants to split\
        \ a specific amount from the otherwise unknown deposit amount. Furthermore the currency must match the __targetAccount__'s\
        \ currency (or default currency).\nWhen a split deposit is indicated all split amounts will be summed up and added\
        \ to the target account's amount. When no amount for the target account was specified the value will just represent\
        \ the sum of all splits. The calculated sum is the total amount for that prestaged deposit and the value is assigned\
        \ to the __targetAccount__'s __amount__ property. The value should be interpreted as the minimum amount that must\
        \ be deposited to satisfy all transactions in the split deposit. See the following response body as example.\n###\
        \ Example: default currency split response\n\n    {\n        \"responseStatus\": {\n            \"success\": true,\n\
        \            \"error\": null\n        },\n        \"prestagedTransactionInfo\": {\n            \"transactionId\":\
        \ \"813984698b1542d18de24220b79ab011\",\n            \"amount\": {\n                \"value\": \"50.00\",\n      \
        \          \"currency\": \"USD\"\n            },\n            \"isSplitDeposit\": false,\n            \"splitData\"\
        : [\n                {\n                    \"account\": {\n                        \"accountNumber\": \"780015\"\
        ,\n                        \"accountType\": \"CHECKING\"\n                    },\n                    \"amount\":\
        \ {\n                        \"value\": \"30.00\",\n                        \"currency\": \"USD\"\n              \
        \      }\n                },\n                {\n                    \"account\": {\n                        \"accountNumber\"\
        : \"888805\",\n                        \"accountType\": \"CHECKING\"\n                    },\n                   \
        \ \"amount\": {\n                        \"value\": \"20.00\",\n                        \"currency\": \"USD\"\n  \
        \                  }\n                }\n            ],\n            \"transactionType\": \"DEPOSIT\",\n         \
        \   \"accessCode\": \"5169\",\n            \"dateCreated\": \"2020-09-15T14:59:30.857+02:00\",\n            \"dateValidFrom\"\
        : \"2020-09-15T14:59:30.857+02:00\",\n            \"dateValidTo\": \"2020-09-15T15:59:30.857+02:00\",\n          \
        \  \"transactionState\": \"PENDING\"\n        }\n    }\n\nA split deposit can also be setup using foreign currencies\
        \ but all amounts are required to use that foreign currency in the request.\n### Example: foreign currency split request\n\
        \n    {\n        \"targetAccount\": {\n            \"accountNumber\": \"78001\",\n            \"accountType\": \"\
        CHECKING\",\n            \"bankCode\": \"12345678\"\n        },\n        \"amount\": {\n            \"value\": \"\
        70.00\",\n            \"currency\": \"EUR\"\n        },\n        \"splitData\": [\n            {\n               \
        \ \"account\": {\n                    \"accountNumber\": \"780015\",\n                    \"accountType\": \"CHECKING\"\
        \n                },\n                \"amount\": {\n                    \"value\": \"30.00\",\n                 \
        \   \"currency\": \"EUR\"\n                }\n            },\n                    {\n                \"account\":\
        \ {\n                    \"accountNumber\": \"888805\",\n                    \"accountType\": \"CHECKING\"\n     \
        \           },\n                \"amount\": {\n                    \"value\": \"20.00\",\n                    \"currency\"\
        : \"EUR\"\n                }\n            }\n        ]\n    }\n\n### Example: foreign currency split response\n\n\
        \    {\n        \"responseStatus\": {\n            \"success\": true,\n            \"error\": null\n        },\n \
        \       \"prestagedTransactionInfo\": {\n            \"transactionId\": \"813984698b1542d18de24220b79ab011\",\n  \
        \          \"amount\": {\n                \"value\": \"120.00\",\n                \"currency\": \"EUR\"\n        \
        \    },\n            \"isSplitDeposit\": false,\n            \"splitData\": [\n                {\n               \
        \     \"account\": {\n                        \"accountNumber\": \"780015\",\n                        \"accountType\"\
        : \"CHECKING\"\n                    },\n                    \"amount\": {\n                        \"value\": \"30.00\"\
        ,\n                        \"currency\": \"EUR\"\n                    }\n                },\n                {\n \
        \                   \"account\": {\n                        \"accountNumber\": \"888805\",\n                     \
        \   \"accountType\": \"CHECKING\"\n                    },\n                    \"amount\": {\n                   \
        \     \"value\": \"20.00\",\n                        \"currency\": \"EUR\"\n                    }\n              \
        \  }\n            ],\n            \"transactionType\": \"DEPOSIT\",\n            \"accessCode\": \"5169\",\n     \
        \       \"dateCreated\": \"2020-09-15T14:59:30.857+02:00\",\n            \"dateValidFrom\": \"2020-09-15T14:59:30.857+02:00\"\
        ,\n            \"dateValidTo\": \"2020-09-15T15:59:30.857+02:00\",\n            \"transactionState\": \"PENDING\"\n\
        \        }\n    }\n\n## Executing the prestaged transaction\nWhen the prestaged transaction is executed and __splitData__\
        \ was not defined in the request, all deposited funds will be transferred to the __targetAccount__.\nWhen __splitData__\
        \ was defined in the request the split deposit transactions are handled first and in the order they were defined.\
        \ From the __default currency split request__ example that would be\n1. __30__ __USD__ to account __780015__ 2. __20__\
        \ __USD__ to account __888805__ 3. Any additional funds to account __78001__\nIf the deposited funds are not sufficient\
        \ to satisfy the split amounts they are skipped and step __3.__ is executed.\n\nWhen the transaction was created successfully\
        \ the server returns details about the transaction  (see __CreateDepositResponsePayload__).\n### Example Response:\
        \ \n\n    {\n        \"responseStatus\": {\n            \"success\": true,\n            \"error\": null          \
        \            \n        },\n        \"cryptoEnvelope\": {\n            \"keyParams\": null,\n            \"payload\"\
        : \"1Dbp80MYqQ/z3+dzIVqxBhHXg6Awu/S1XVbK7OcbHZCw5ubyMrv4TjZLq5+U6bvtiRBWFeitgcWWb8Ng+TjOWQ==\"\n        }\n    }\n\
        \n\n__Using RSA/AES:__\nThe server generates an AES key (256 bit) and iv (128 bit) to encrypt the response payload.\
        \ After the payload encryption the key parameters are encrypted with the client's public RSA key (see __clientSecretparam__).\
        \ The encrypted key parameters and payload are stored in a __CryptoEnvelope__ entity that is attached to the response\
        \ body.\n\n__Using ECIES:__\nThe server uses the client's EC public key (see __clientSecretParam__) to encrypt the\
        \ response payload. The encrypted payload is stored in a __CryptoEnvelope__ entity that is attached to the response\
        \ body."
      operationId: createDeposit
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      requestBody:
        $ref: '#/components/requestBodies/createDepositRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/createDepositResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /createBranchDeposit:
    post:
      tags:
      - Prestaged Transaction API
      summary: Create a prestaged deposit transaction request.
      description: "Create a branch based prestaged deposit transaction request. The server creates the transaction if the\
        \ request can be validated and processed successfully. It is mapped to the consumerId and has an __infinite__ lifetime.\
        \ To execute the transaction at a Cash-Recycler ATM or with a contact-less  mobile application (see __/executePrestagedTransaction__)\
        \ an accessCode is created and sent to a  third party member. This step is __not__ optional for this request type.\
        \  The accessCode can be sent by Email or SMS.\n\nWhen the transaction was created successfully the server returns\
        \ details about the transaction  (see __CreateBranchDepositResponsePayload__).\n### Example Response: \n\n    {\n\
        \        \"responseStatus\": {\n            \"success\": true,\n            \"error\": null                      \n\
        \        },\n        \"cryptoEnvelope\": {\n            \"keyParams\": null,\n            \"payload\": \"1Dbp80MYqQ/z3+dzIVqxBhHXg6Awu/S1XVbK7OcbHZCw5ubyMrv4TjZLq5+U6bvtiRBWFeitgcWWb8Ng+TjOWQ==\"\
        \n        }\n    }\n\n\n__Using RSA/AES:__\nThe server generates an AES key (256 bit) and iv (128 bit) to encrypt\
        \ the response payload. After the payload encryption the key parameters are encrypted with the client's public RSA\
        \ key (see __clientSecretparam__). The encrypted key parameters and payload are stored in a __CryptoEnvelope__ entity\
        \ that is attached to the response body.\n\n__Using ECIES:__\nThe server uses the client's EC public key (see __clientSecretParam__)\
        \ to encrypt the response payload. The encrypted payload is stored in a __CryptoEnvelope__ entity that is attached\
        \ to the response body."
      operationId: createBranchDeposit
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      requestBody:
