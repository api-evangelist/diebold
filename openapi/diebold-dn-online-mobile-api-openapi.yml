    BusinessCorrelationId:
      type: string
      minLength: 1
      description: "The businessCorrelationId of the newly created prestaged transaction. The businessCorrelationId is used\
        \ for logging and tracing purposes inside Transaction Middleware. \nFor example, when a client creates a prestaged\
        \ cash out transaction which is to be executed later, those two otherwise distinct calls can be \"correlated\" together\
        \ using the businessCorrelationId. The id generated on transaction creation must be provided to the /executePrestagedTransaction\
        \ endpoint to make use of this feature."
      example: 886aaaf82a3d4e4ebe4667a2402592c9
