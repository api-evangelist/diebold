          $ref: '#/components/responses/defaultResponse'
components:
  securitySchemes:
    bearerAuth:
      description: When using the bearer authentication method an access token has to be provided in the HTTP authorization
        header. When using openIdConnect as security scheme the access token has to be provided in the Authorization header
        with the bearer scheme while the id token has to be provided in the __consumerIdParam__ which must also be encrypted.
      type: http
      scheme: bearer
  parameters:
    sessionTokenParam:
      name: Dn-Tm-Omapi-Session-Token
      in: header
      description: A unique identifier of a consumer session (within an external system), which is required to validate the
        consumer session. The default implementation expects in the sessionToken parameter a valid openId Connect id_token.
        Moreover, the default implementation expects in the authorization header of the http request the authorization schema
        "Bearer" followed by a valid openId Connect access token. This parameter should be encrypted and encoded in base64.
      required: true
      schema:
        type: string
        minLength: 1
    consumerIdParam:
      name: Dn-Tm-Omapi-Consumer-Id
      in: header
      description: A unique identifier of a consumer (within an external system), which is required to identify the consumer.
        Maybe the consumerId is moreover/also used to authorize the consumer against an external system. This parameter should
        be encrypted and encoded in base64.
      required: true
      schema:
        type: string
        minLength: 1
    referenceIdParam:
      name: Dn-Tm-Omapi-Reference-Id
      in: header
      description: A unique identifier referring to a transaction in TM. This parameter should be encrypted and encoded in
        base64.
      required: true
      schema:
        type: string
        minLength: 1
    panParam:
      name: Dn-Tm-Omapi-Pan
      in: header
      description: The PAN of the card to get the preferences for. This parameter should be encrypted and encoded in base64.
      required: true
      schema:
        type: string
        pattern: ^\d+$
        format: PAN
        minLength: 13
        maxLength: 19
        example: '4761739028380180'
    scopeParam:
      name: Dn-Tm-Omapi-Scope
      in: header
      required: true
      description: The 'scope' of the preferences. If the scope is not given, all preferences are returned without taking
        any certain scope into account.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    accountNumberParam:
      name: Dn-Tm-Omapi-Account-Number
      in: header
      required: true
      description: 'The account number. The length varies greatly. In Europe defined by ISO 13616/2007 See also: https://en.wikipedia.org/wiki/International_Bank_Account_Number
        This parameter should be encrypted and encoded in base64.

        '
      schema:
        type: string
        minLength: 2
        maxLength: 32
        example: DE19123412341234123412
    bankCodeParam:
      name: Dn-Tm-Omapi-Bankcode
      in: header
      required: false
      description: "Contains the BIC (aka. bank identifier code)\n  The BIC - also known as SWIFT-code - as defined by ISO\
        \ 9362 is required in/for cross border transfers/transactions.\n  Please see: https://en.wikipedia.org/wiki/ISO_9362\n\
        \  This field can also be used to send/receive an ABA RTN (ABA routing transit number) or Canadian TN(Canadian transit\
        \ number).\n  See also: https://en.wikipedia.org/wiki/Routing_transit_number\n  This parameter should be encrypted\
        \ and encoded in base64.\n"
      schema:
        type: string
        pattern: ^[A-Za-z0-9]*$
        minLength: 8
        maxLength: 11
    accountTypeParam:
      name: Dn-Tm-Omapi-Account-Type
      in: header
      required: true
      description: 'The default account type is 820000 (NOT_SPECIFIED). Please see: /getAccountTypes for all possible values.
        This parameter should be encrypted and encoded in base64.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 64
    clientSecretParam:
      name: Dn-Tm-Omapi-Client-Secret
      in: header
      required: true
      description: "Depending on the crypto scheme (RSA/AES or ECIES) the client intends to use the corresponding properties\
        \ of the __CryptoParams__ schema defined by OM-API should be filled accordingly and sent back to the server as stringified\
        \ JSON. For example:\n\n__Using RSA/AES:__\n\n        cryptoParams: {\n            aesKeyParams: {\n             \
        \   key: \"uMSlxHYT+ttxz0T+nL+A344iP6ujJdodCn6k5MmjWDC0T+MFCXcs1OjXK1DaYFaP3v1mqN9+uh58FE0VxcwFGaRSp6uDfbl9Oaji7v0vDS9mMFa4hzMoiiYBmRKUemTNkJOcgCpDi7kDNHPB+gpqYyc4dMFfPvSCG/SYv7CFXTA=\"\
        ,\n                iv: \"FgZ/HdtOhroVzRd802X3NgHCuiqBjCM+6Q/6PS0lUrROBe8T+me444KpKt112gLwHck7nmOVkZJPznWf7bpX6dh+mcIQ/3B7PJ3xGEsHbmSXEAK10C+AKwXpI9Sdig8feP2QT+Hd0d1qGk0X93OFaJ/zfqs/MNIesNTVAY2YBIw=\"\
        \n            },\n            rsaPublicKey:\"-----BEGIN PUBLIC KEY-----\\nMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCeB05D31/zFICpf9JJWDo1ZVXt\\\
        npYwvJa6ka0g0EHN95C8fvMguNDmprslmsOqaJYplmknWpWjbHAtIPpqrtY3H6eWP\\nELkBN2hitJlQQjf1y2jsWHsSH7BsVY5z1hCzJySFE7Q1ae9WuYj3RTsq+4ZZpEk7\\\
        nCjRdjA26emVkCR3vWwIDAQAB\\n-----END PUBLIC KEY-----\"\n            }\n\nThe property __rsaPublicKey__ is used to\
        \ send the client's public key to the server in order to create encrypted responses. It is recommended to use __rsaPublicKey__\
        \ key size of  - at least - 1024 bit.\nThe property __aesKeyParams__ is used to send the client's AES key (256bit)\
        \ and iv (128bit) to the server. Both values __must__ be encrypted with the servers public RSA key (see __/getRsaKey__).\n\
        \n__Using ECIES:__\n\n        cryptoParams: {\n            \"ecPublicKey\":{\n                \"publicKeyPem\":\"\
        -----BEGIN PUBLIC KEY-----\\nMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEHPMaBu6d0BR6QFw3VKwPipuAdDPL\\nG36/aoyTx7iTK1xgoi7X9aMmT1x3Qh1+S1zVhBh2LDDEljHkkVyHrl4bOg==\\\
        n-----END PUBLIC KEY-----\\n\"\n                }\n            }\n\nThe property __ecPublicKey__ is used to send the\
        \ client's public key to the server in order to create encrypted responses."
      schema:
        type: string
        minLength: 1
