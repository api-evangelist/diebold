  /getCreditors:
    get:
      tags:
      - Miscellaneous API
      summary: Get a list of system wide defined payees.
      description: 'Retrieves a list of payees. Just to make it clear once and for all, the workflow is as follows: First
        the mobile app calls ''getCreditors'' to get a list of all system wide available creditors. This list is displayed
        to the customer, using the provided data (CreditorData), to enable the customer to choose the right one creditor.
        The customer selects the creditor from this list to whom he wishes to pay an invoice. The app uses the provided data
        from the response of the call "getCreditors" to show the customer (already) fields with which he can further limit
        the invoice to be paid if necessary. Thereafter the app calls ''getSinglePaymentOrderData'' again with the ''creditorId''
        of the selected creditor and - if there was any input from the customer - a pre-filled object of SinglePaymentOrderRequestData.
        The server answers again with a SinglePaymentOrderResponseData object, which contains the PaymentOrderData, which
        was found in the servers database. The returned PaymentOrderData should uniquely identify a certain payment transaction
        of the customer. The mobile app presents the payment data to the customer and the customer fills in or corrects -
        any - missing transaction data/fields. Finally the app calls ''createTransfer'' using the whole (entered or corrected)
        data for a transfer transaction.'
      operationId: getCreditors
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      - $ref: '#/components/parameters/bankCodeParam'
      responses:
        '200':
          $ref: '#/components/responses/getCreditorsResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
