      type: object
      required:
      - orderId
      - amount
      - sourceAccount
      - beneficiaryAccount
      - receiverName
      - recurrenceType
      - startDate
      - endAfter
      properties:
        orderId:
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
        sourceAccount:
          $ref: '#/components/schemas/ShortAccountInfo'
        beneficiaryAccount:
          $ref: '#/components/schemas/ShortAccountInfo'
        receiverName:
          type: string
          minLength: 1
          maxLength: 255
        transactionComment:
          type: string
          minLength: 1
          maxLength: 255
        recurrenceType:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
        firstExecutionDate:
          $ref: '#/components/schemas/OmapiDate'
        lastExecutionDate:
          $ref: '#/components/schemas/OmapiDate'
        lastExecutionState:
          type: string
        nextExecutionDate:
          $ref: '#/components/schemas/OmapiDate'
        endAfter:
          type: string
          description: This string can contain different values:<br> 1.) The parameter contains "NO_END". In this case the
            execution will happen as long as the standing order exists. Pay attention to the capitalization! 2.) The parameter
            contains a positive and integer number. The standing order is executed as often as defined by this positive, integer
            number in the parameter "endAfter". 3.) The parameter contains a values which matches a date with the pattern
            like '([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))'. In this case the date defines the latest execution date.
          example: '1'
    PrestagedTransactionType:
      type: string
      enum:
      - CASHOUT
      - DEPOSIT
      - SPLIT
      - BRANCH_DEPOSIT
      description: "The type of a prestaged transaction.\n| Symbolic name  | Comment                                     \
        \             | |----------------|----------------------------------------------------------| | CASHOUT        | It\
        \ was a cashout (credit) transaction.                   | | DEPOSIT        | It was a cashin (debit/deposit) transaction.\
        \             | | BRANCH_DEPOSIT | It was a cashin (debit/deposit) transaction in a branch. | | SPLIT          | It\
        \ was a split deposit as part of a cashin transaction.  |\n  <br>\n"
      example: CASHOUT, DEPOSIT, SPLIT or BRANCH_DEPOSIT
    PrestagedTransactionState:
      type: string
      enum:
      - FAILED
      - CREATED
      - PENDING
      - PAYED
      - EXPIRED
      description: "The state of a prestaged transaction.\n| Symbolic name | Comment                                     \
        \                                                       | |---------------|----------------------------------------------------------------------------------------------------|\
        \ | FAILED        | The pending transaction failed for whatever reason, e.g. expired or so. It's a final state.  \
        \      | | CREATED       | The pending transaction has been created. State will asynchronously change to PENDING immediately.\
        \ | | PENDING       | The transaction is valid and pending.                                                      \
        \        | | PAYED         | The transaction has been executed and is in a final state.                          \
        \               | | EXPIRED       | The transaction is expired. This is a final state too.                       \
        \                      |\n\n  <br>\n"
      example: PENDING
    CardlessModeEnum:
      type: string
      enum:
      - SELF
      - OTHER
      - MEANINGLESS
      description: 'The type of a prestaged transaction.

        | Symbolic name | Comment                                                                              | |---------------|--------------------------------------------------------------------------------------|
        | SELF          | It was a cashout (credit) transaction for the customer himself.                      | | OTHER         |
        It was a cashout (credit) transaction for a different person. Not for the customer.  | | MEANINGLESS   | It wasn''t
        a cashout (credit) transaction, so the the ''cardlessMode'' is meaningless.  |

        '
      example: SELF
    CommonPrestagedTransactionInfo:
      type: object
      discriminator:
        propertyName: modelType
      required:
      - transactionId
      - transactionType
      - accessCode
      - dateValidFrom
      - transactionState
      properties:
        modelType:
          type: string
        transactionId:
          type: string
          minLength: 1
          description: The transaction ID of the newly created prestaged transaction.
          example: 5c2af6a642984309b4f094671824c730
        businessCorrelationId:
          $ref: '#/components/schemas/BusinessCorrelationId'
        amount:
          $ref: '#/components/schemas/Amount'
        transactionType:
          $ref: '#/components/schemas/PrestagedTransactionType'
        transactionComment:
          $ref: '#/components/schemas/TransactionComment'
        dateCreated:
          type: string
          format: yyyy-MM-dd HH:mm:ssZ
          description: 'The date when the prestaged transaction was created. As defined by date-time - RFC3339. Please see:
            https://tools.ietf.org/html/rfc3339'
          example: '2017-10-02T15:00:00.05Z'
        dateValidFrom:
          type: string
          format: yyyy-MM-dd HH:mm:ssZ
          description: 'The date from which the prestaged transaction is valid. As defined by date-time - RFC3339. Please
            see: https://tools.ietf.org/html/rfc3339'
          example: '2017-10-02T15:00:00.05Z'
        dateValidTo:
          type: string
          format: yyyy-MM-dd HH:mm:ssZ
          description: 'The date until the prestaged transaction is valid. As defined by date-time - RFC3339. Please see:
            https://tools.ietf.org/html/rfc3339'
          example: '2017-10-01T18:00:00.00Z'
        transactionState:
          $ref: '#/components/schemas/PrestagedTransactionState'
    PrestagedCashoutTransactionInfo:
      allOf:
      - $ref: '#/components/schemas/CommonPrestagedTransactionInfo'
      type: object
