      required:
      - code
      properties:
        code:
          description: An error code as outlined in the PC/E documentation.
          type: integer
          format: int32
          minimum: 0
          example: 850004
        message:
          description: An optional, additional message which describes the error.
          type: string
          maxLength: 255
          example: Internal server error. A database connection could not be established.
    ResponseBase:
      description: "Every number used by OM-API is within a certain number range.<br> The OM-API V4 number range is 2870000\
        \ - 2879999.<br> Within that range, every requests group has its number range of 1000: <br>\n  | Request Group | Number\
        \ Range                       |\n  |---------------|------------------------------------|\n  | Account Management\
        \ API          | 2870000-2870999  |\n  | Standing Order API              | 2871000-2871999  |\n  | Prestaged Transaction\
        \ API       | 2872000-2872999  |\n  | Miscellaneous API               | 2873000-2873999  |\n  | Accessibility API\
        \               | 2874000-2874999  |\nWithin each group range, every belonging request has its number range of 100:\n\
        \  <br>\n  | Request Name  | Number Range                       |\n  |---------------|------------------------------------|\n\
        \  | *Account Management API*\n  | getAccounts                     | 2870000-2870099  |\n  | getAccountTypes     \
        \            | 2870100-2870199  |\n  | getAccountDetails               | 2870200-2870299  |\n  | getTransactions \
        \                | 2870300-2870399  |\n  | getScheduledTransactions        | 2870400-2870499  |\n  | checkAccount\
        \                    | 2870500-2870599  |\n  | createTransfer                  | 2870600-2870699  |\n  | createDispute\
        \                   | 2870700-2870799  |\n  | &nbsp;\n  | *Standing Order API*\n  | getStandingOrders            \
        \   | 2871000-2871099  |\n  | createStandingOrder             | 2871100-2871199  |\n  | updateStandingOrder      \
        \       | 2871200-2871299  |\n  | deleteStandingOrder             | 2871300-2871399  |\n  | updateAccountNickname\
        \           | 2871400-2871499  |\n  | &nbsp;\n  | *Prestaged Transaction API*\n  | createCashout4Me              \
        \  | 2872000-2872099  |\n  | createCashout2You               | 2872100-2872199  |\n  | createDeposit             \
        \      | 2872200-2872299  |\n  | createBranchDeposit             | 2872300-2872399  |\n  | deletePrestagedTransaction\
        \      | 2872400-2872499  |\n  | getPrestagedTransactions        | 2872500-2872599  |\n  | executePrestagedTransaction\
        \     | 2872600-2872699  |\n  | &nbsp;\n  | *Miscellaneous API*\n  | getCreditors                    | 2874000-2874099\
        \  |\n  | getSinglePaymentOrderData       | 2874100-2874199  |\n  | getPreferences                  | 2874200-2874299\
        \  |\n  | setPreferences                  | 2874300-2874399  |\n  | getClientBranding               | 2874400-2874499\
        \  |\n  | getGenericTransactionOrders     | 2874500-2874599  |\n  | performGenericTransactionOrder  | 2874600-2874699\
        \  |\n  | getLocations                    | 2874700-2874799  |\n  | &nbsp;\n  | *Accessibility API*\n  | getRsaKey\
        \                       | 2875000-2875099  |\n  | getEcKey                        | 2875100-2875199  |\n  | getVersion\
        \                      | 2875200-2875299  |\n  <br>\n  The numbers in the ranges are used primarily for the error\
        \ codes (see Error schema)."
      type: object
      required:
      - success
      properties:
        success:
          description: 'Returns True or False to indicate the success of the API call.

            The The error property is optional.

            It is set only if an error has been detected.

            '
          type: boolean
          example: true
        error:
          $ref: '#/components/schemas/Error'
    Credentials:
      description: Schema to easily generate a Credentials object for server side validation of the user credentials. The
        Credentials object contains the sessionToken and the consumerId.
      type: object
      required:
      - sessionToken
      - consumerId
      properties:
        sessionToken:
          type: string
          description: A unique identifier of a consumer (within an external system) which is required to authorize access
            to the system.
          example: 46CAADAB87D847B08B0A4F46973EA2E8
        consumerId:
          type: string
          minLength: 1
          description: A unique identifier of a consumer (within an external system) which is required to identify the consumer
            and authorize access to the system.
          example: 46CAADAB87D847B08B0A4F46973EA2E8
    KeyValuePair:
      description: A key value pair to store/retrieve a key and a value as strings in a generic way. Used in some API calls/objects.
      type: object
      required:
      - key
      - value
      properties:
        key:
          description: A unique key which identifies a certain value.
          type: string
          minimum: 1
          maximum: 255
          example: this-is-a-sample-key
        value:
          description: The assigned value of the key. It contains a maximum of 1MB data.
          type: string
          minLength: 0
          maxLength: 1048576
          example: this-is-a-sample-value
    OmApiSupplementaryData:
      type: object
      description: / Represents supplementary data as a collection of TM facets.<br> It is assumed, that the TM facets can
        be obtained from the request data in the following way...<br> <b>FacetContainer container = FacetContainerMapperUtil.fromJsonMap(facets);</b>
      properties:
        facets:
          type: object
      additionalProperties: false
    OmapiDate:
      type: string
      pattern: ([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))
      description: 'The date pattern is defined "YYYY-MM-DD", with YYYY as 4-digit year, MM as 2-digit month and DD as 2-digit
        day of month.

        Date string as defined by date-time - RFC3339

        Please see: https://tools.ietf.org/html/rfc3339

        '
      example: '2020-01-31'
    MsisdnString:
      type: string
      format: ^\+(?:[0-9]\x20?){6,14}[0-9]$
      description: The numbers must start with a plus sign, followed by the country code and national number regarding ITU-T
        E.123 and ITU-T E.164 Phone numbers cannot contain more than 15 digits. The shortest international phone numbers in
        use contain seven digits.
    MSISDN:
      type: object
      required:
      - MSISDN
      properties:
        MSISDN:
          $ref: '#/components/schemas/MsisdnString'
    MailAddressString:
      type: string
      format: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
      description: A valid eMail addressas defined by RFC5322.
    MailAddress:
      type: object
      required:
      - MailAddress
      properties:
        MailAddress:
          $ref: '#/components/schemas/MailAddressString'
    NotificationReceiver:
      type: object
      required:
      - destinationOfNotification
      properties:
        name:
          type: string
          minLength: 1
          example: Mary-Jane
        surname:
          type: string
          minLength: 1
          example: Blunt
        title:
          type: string
          minLength: 1
          example: Mrs.
        destinationOfNotification:
          $ref: '#/components/schemas/SendToSpec'
    SendToSpec:
      oneOf:
      - $ref: '#/components/schemas/MSISDN'
      - $ref: '#/components/schemas/MailAddress'
    RsaPublicKey:
      allOf:
      - $ref: '#/components/schemas/PublicKeyPem'
    EcPublicKey:
      allOf:
      - $ref: '#/components/schemas/PublicKeyPem'
    PublicKeyPem:
      description: A holder object for PEM formatted public keys
      type: object
      required:
      - publicKeyPem
      properties:
        publicKeyPem:
          type: string
          minLength: 1
          example: '"-----BEGIN PUBLIC KEY-----\nMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEt0 GMNz1Geam/Jw4lbIoPcspDbWt2\n84U+yYZqnqMIa5gQZyJNsTRdvDfb2jdP3MUVBJM
            UoOeuGTF/cJy4uQ587w==\n-----END PUBLIC KEY-----\n"'
    AesKeyParams:
      description: A holder object for AES symmetric key params.
      required:
      - key
      - iv
      properties:
        key:
          description: The Base64 encoded (and encrypted) AES key (256bit).
          type: string
          example: MTI4MzI1Mjc2NTI=
        iv:
          description: The Base64 encoded (and encrypted) AES iv (128bit).
          type: string
          example: MTI4MzI1Mjc2NTI=
    AesKeyByteParams:
      description: A holder object for AES symmetric key params. For encryption of the AES key params the public RSA key of
        the server must be used for requests. In the response the server will use the clients public RSA key.
      required:
      - key
      - iv
      properties:
        key:
          description: The Base64 encoded (and encrypted) AES key.
          type: string
          format: byte
          example: MTI4MzI1Mjc2NTI=
        iv:
          description: The Base64 encoded (and encrypted) AES iv.
          type: string
          format: byte
          example: MTI4MzI1Mjc2NTI=
    CryptoParams:
      type: object
      properties:
        rsaPublicKey:
          $ref: '#/components/schemas/RsaPublicKey'
        ecPublicKey:
          $ref: '#/components/schemas/EcPublicKey'
        aesKeyParams:
          $ref: '#/components/schemas/AesKeyParams'
    CryptoEnvelope:
      type: object
      required:
      - payload
      description: Object holding a cryptographically secured request properties.
      properties:
        keyParams:
          $ref: '#/components/schemas/AesKeyParams'
        payload:
          type: string
          minLength: 1
          example: BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+
    AccountNumber:
      description: 'The account number. The length varies greatly. In Europe defined by ISO 13616/2007

        See also:

        https://en.wikipedia.org/wiki/International_Bank_Account_Number

        '
      type: string
      minLength: 2
      maxLength: 32
      example: DE19123412341234123412
    AccountWarning:
      description: Warnings regarding the bank account of a user.
      type: object
      properties:
        effectiveDate:
          description: Date since the warning is active.
          type: string
          maxLength: 255
          example: Thu Nov 28 10:40:41 CET 2019
        expirationDate:
          description: Date where the warning will expire.
          type: string
          maxLength: 255
          example: Thu Nov 28 10:40:41 CET 2019
        warningCode:
          description: A warning code.
          type: string
          maxLength: 255
          example: A3056-XT
        warningText:
          description: Warning description text.
          type: string
          maxLength: 255
          example: Too much money in the bank
        category:
          description: The warning category
          type: string
          maxLength: 255
          example: SEVERE_WARNINGS
    SwiftCode:
      description: 'Contains the BIC (aka. bank identifier code)

        The BIC - also known as SWIFT-code - as defined by ISO 9362 is required in/for cross border transfers/transactions.

        Please see: https://en.wikipedia.org/wiki/ISO_9362


        This field can also be used to send/receive an ABA RTN (ABA routing transit number) or Canadian TN (Canadian transit
        number).

        See also: https://en.wikipedia.org/wiki/Routing_transit_number

        The bank code is NOT required!

        '
      type: string
      pattern: ^[A-Z0-9]+$
      minLength: 8
      maxLength: 11
    AdditionalCreditorFieldDescription:
      description: A key value pair to store/retrieve a key and a value as strings in a generic way. Used in some API calls/objects.
      type: object
      required:
      - fieldName
      - minFieldLength
      - maxFieldLength
      properties:
        fieldName:
          description: A unique key which identifies a certain value.
          type: string
          minimum: 1
          maximum: 255
          example: invoice number
        minFieldLength:
          description: Conatains the minimum length of the input field.
          type: integer
          example: 10
        maxFieldLength:
          description: Conatains the maximum length of the input field.
          type: integer
          example: 55
    Currency:
      description: 'The currency code as defined by ISO 20022, ActiveCurrencyCode

        See also: https://en.wikipedia.org/wiki/ISO_4217

        '
      type: string
      minLength: 3
      maxLength: 3
      pattern: '[A-Z]{3,3}'
      example: USD
    Amount:
      description: The basic type of an amount.
      type: object
      required:
      - value
      - currency
      properties:
        value:
          description: The amount value of the given currency. As defined by ISO 20022, CurrencyAndAmount.
          type: string
          pattern: '[0-9]{1,13}\.[0-9]{1,3}'
          minimum: 0
          example: 345.67
        currency:
          $ref: '#/components/schemas/Currency'
    TypedAmount:
      description: An enhanced type of amount carrying additional type data.
      allOf:
      - $ref: '#/components/schemas/Amount'
      type: object
      properties:
        amounttype:
          type: string
    TransactionComment:
      type: string
      minimum: 1
      maximum: 255
      description: A comment field to provide more context to the transaction
      example: A very important transaction
    Recipient:
      type: string
      minimum: 1
      maximum: 255
      description: A field to provide more context about the transaction recipient
      example: Mr. Smith
    MediaType:
      type: string
      enum:
      - CASH
      - CHECK
      - MIXED
    WorkstationType:
      type: string
      enum:
      - TYPE_INVALID
      - TYPE_ATM
      - TYPE_STP
      - TYPE_SST
      - TYPE_POS
      - TYPE_CRS
      - TYPE_CCDM
      description: "The type of the device at the location, such as Automated Teller Machine (ATM), Self Service Terminal\
        \ (SST), Statement Printer (SP)\n\n  | Symbolic name | Comment                            |\n  |---------------|------------------------------------|\n\
        \  | TYPE_INVALID  | Invalid type information/Unknown   |\n  | TYPE_ATM      | Automated Teller Machine (CashOut)\
        \ |\n  | TYPE_STP      | Statement printer                  |\n  | TYPE_SST      | Self Service Terminal         \
        \     |\n  | TYPE_POS      | Point of Sales                     |\n  | TYPE_CRS      | Cash Recycler (Cash in/Cash\
        \ out)   |\n  | TYPE_CCDM     | Check/Cash Deposit Module          |\n  <br>\n"
      example: TYPE_ATM
    WorkstationStatus:
      type: string
      enum:
      - UNKNOWN
      - OPEN_CONSUMER
      - OPEN_CONSUMER_WITH_RESTRICTIONS
      - GREEN_IT
      - CLOSE_CONSUMER
      description: "The required current state of the the device(s) near to the given location, such as\n  Online, Online\
        \ with restrictions, ...\n  If the array is empty, all states of devices are considered.\n\n  | Symbolic name    \
        \                | Comment                                                                                       \
        \       |\n  |----------------------------------|------------------------------------------------------------------------------------------------------|\n\
        \  | UNKNOWN                          | The device status is unknown or not one of the following states.         \
        \                            |\n  | OPEN_CONSUMER                    | The device (e.g. the ATM) is ready to serve\
        \ customers.                                               |\n  | OPEN_CONSUMER_WITH_RESTRICTIONS  | The device is\
        \ ready, but has (some) limitations, e.g. not all transactions are supported right now.  |\n  | GREEN_IT         \
        \                | The device is in GeenIT mode.                                                 |\n  | CLOSE_CONSUMER\
        \                   | The device is NOT ready to serve customers. However this does not seem to make sense.      \
        \           |"
      example: OPEN_CONSUMER
    RequiredTransactions:
      type: object
      required:
      - transactions
      properties:
        transactions:
          type: array
          items:
            type: string
            description: 'The type of transactions supported by the machine.

              '
            example:
            - WITHDRAWAL
            - DEPOSIT
            - CHECK_DEPOSIT
    SupportedTransactions:
      type: object
      required:
      - transactions
      properties:
        transactions:
          type: array
          items:
            type: string
            description: 'The type of transactions supported by the machine.

              '
            example:
            - WITHDRAWAL
            - DEPOSIT
            - CHECK_DEPOSIT
    GetLocationsTransactionConstants:
      type: string
      enum:
      - WITHDRAWAL
      - DEPOSIT
      - CHECK_DEPOSIT
      - CHECK_CASHING
      - CASH_PAYMENT
      - PSWITHDRAWAL
      - PSDEPOSIT
      description: 'GetLocationsTransactionConstants are mapped to TM transaction constants or service transaction constants.
        These must be specified in the workstation profile to get a match.

        | Symbolic name     | Comment                                                | TM Transaction Constant       | |-------------------|--------------------------------------------------------|-------------------------------|
        | WITHDRAWAL        | The machine supports cash out transactions             | WITHDRAWAL                    | | DEPOSIT           |
        The machine supports cash in transactions              | DEPOSIT & MIXED_MEDIA_PAYMENT | | CHECK_DEPOSIT     | The
        machine supports check deposit transactions        | CHECK_DEPOSIT                 | | CHECK_CASHING     | The machine
        supports check cashing transactions        | CHECK_CASHING                 | | CASH_PAYMENT      | The machine supports
        cash payment transactions         | CASH_PAYMENT                  | | PSWITHDRAWAL      | The machine supports prestaged
        cash out transactions   | PRESTAGED_WITHDRAWAL          | | PSDEPOSIT         | The machine supports prestaged cash
        in transactions    | PRESTAGED_DEPOSIT             |

        '
    OmapiAccountType:
      type: string
      enum:
      - NOT_SPECIFIED
      - GIRO
      - LOAN
      - SAVINGS
      - SECURITIES_DEPOSIT
      - SAVINGS_SECURITIES_DEPOSIT
      - GIRO_SECURITIES_DEPOSIT
      - FIXED_TERM_DEPOSIT
      - CREDIT_CARD
      - MORTGAGE
      - FOREIGN_CURRENCY
      - EXTERNAL
      - CHECKING
      - UNIVERSAL
      - SPENDING_POWER
      - FEE_COLLECTION_ACCOUNT
      - ATM
      - VENDOR
      - SHAREHOLDER
      - GENERAL_LEDGER
      - CASH_RESERVE
      - LOAN_DENIAL
      - LEASE
      - CONSUMER_LOAN
      - COMMERCIAL_LOAN
      - RETIREMENT_LOAN
      - EXTERNAL_LOAN
      - SHARE
      - INDIVIDUAL_RETIREMENT
      - CARD_PAN
      - HEALTH_SAVINGS
      - CREDIT
      - CREDIT_LINE
      - CERTIFIED_DEPOSIT
      - INSTALLMENT
      example: GIRO
      description: 'The default account type is 820000 (NOT_SPECIFIED). Please see: /getAccountTypes for all possible values.'
    ShortAccountInfo:
      description: An object used to hold only essential account data which is used in the context of API requests, e.g. prestaged
        transactions.
      type: object
      required:
      - accountNumber
      - accountType
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        bankCode:
          $ref: '#/components/schemas/SwiftCode'
        accountType:
          $ref: '#/components/schemas/OmapiAccountType'
    AccountInfo:
      type: object
      required:
      - accountNumber
      - accountType
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        accountType:
          $ref: '#/components/schemas/OmapiAccountType'
        bankCode:
          $ref: '#/components/schemas/SwiftCode'
        accountName:
          type: string
          maxLength: 255
          description: The account name which is displayed to the user.
          example: Personal Checking Account
        accountOwnerName:
          type: string
          maxLength: 255
          description: The name of the account owner.
          example: Betty Adams
        accountStatus:
          type: string
          maxLength: 255
          description: Status description of the account.
        accountOwnership:
          type: string
          maxLength: 255
          minLength: 1
          description: Ownership description of the account.
          example: Betty Adams
        accountWarnings:
          type: array
          items:
            $ref: '#/components/schemas/AccountWarning'
        accountCurrency:
          $ref: '#/components/schemas/Currency'
        amounts:
          type: array
          items:
            $ref: '#/components/schemas/TypedAmount'
        possibleTransactions:
          description: A list of possible transactions, which can be used on this account.
          type: array
          items:
            type: string
            description: Transaction name
          example: WITHDRAWAL,CASH_IN,LOAD_PREPAID
        properties:
          description: A list of addtional account properties.
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
    OmApiAccountRef:
      type: object
      required:
      - accountNumber
      - accountType
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        accountType:
          $ref: '#/components/schemas/OmapiAccountType'
    Address:
      type: object
      required:
      - street
      - streetno
      - city
      - zipcode
      properties:
        street:
          type: string
          maxLength: 255
          description: The name of the street.
          example: Mainstreet
        streetno:
          type: string
          maxLength: 255
          description: The street number of this address.
          example: '119'
        city:
          type: string
          maxLength: 255
          description: The name of the city.
          example: New York
        zipcode:
          type: string
          maxLength: 255
          description: The zip code of this city.
          example: NY 5467
        countrycode:
          type: string
          maxLength: 255
          description: 'The ISO 3166 (alpha-3) country code of this address.

            See also: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3

            '
          example: USA
    AccountWithAmount:
      type: object
      required:
      - account
      - amount
      properties:
        account:
          $ref: '#/components/schemas/ShortAccountInfo'
        amount:
          $ref: '#/components/schemas/Amount'
        transactionComment:
          $ref: '#/components/schemas/TransactionComment'
    DenominationAlgorithm:
      type: object
      required:
      - algorithm
      properties:
        algorithm:
          type: string
          enum:
          - EVENLY_MIXED
          - HIGH_NOTES_PREFERED
          - LOW_NOTES_PREFERED
          description: 'The denomination algorithm determines the number and type of notes to be output at the ATM for that
            cashout transaction.

            | Symbolic name       | Comment | |---------------------|------------------------------------------------------------------------------------------------------|
            | EVENLY_MIXED        | The denomination mix is based on thresholds and the available cassettes. The amount is
            decreased by  | |                     | the highest possible note as long as the remaining amount is lower as
            the threshold for this note.   | |                     | This is to be continued with lower notes until the remaining
            amount is 0.                            | | HIGH_NOTES_PREFERED | As few notes as possible are extracted from
            the cash units, i.e. the cash units with notes of high   | |                     | value are preferred. | | LOW_NOTES_PREFERED  |
            Here the MANY_UNITS algorithm is used. However if one kind of denomination accumulate to more than   | |                     |
            66% of the requested amount one of this notes is divided into lower denominations until the sum of   | |                     |
            values of that denomination is below 66% of the complete amount.                                     |'
          example: EVENLY_MIXED
    PaymentType:
      type: object
      required:
      - paymentType
      properties:
        paymentType:
          type: string
          enum:
          - LOAN
          - CREDIT_CARD
          - BILL
          - SEPA
          - NOT_SPECIFIED
          description: "The payment type of a transfer transaction.\n| Symbolic name | Comment                           \
            \                             | |---------------|----------------------------------------------------------------|\
            \ | LOAN          | Payment to/from Loan account.                                  |  | CREDIT_CARD   | Payment\
            \ from Credit card account.                              | | BILL          | Payment to/from Bill account.   \
            \                               |  | SEPA          | Payment to/from SEPA account.                           \
            \       |  | NOT_SPECIFIED | The payment type has not been specified or is simply unknown.  | \n  <br>\n"
          example: LOAN
    PaymentSubType:
      type: object
      required:
      - paymentSubType
      properties:
        paymentSubType:
          type: string
          enum:
          - PRINCIPAL
          - REGULAR
          - PAYOFF
          - INST
          - NOT_SPECIFIED
          description: "The payment sub type (especially for loan payment) of a transfer transaction.\n| Symbolic name | Comment\
            \                                                            | |---------------|--------------------------------------------------------------------|\
            \ | NOT_SPECIFIED | The payment sub type has not been specified or is simply unknown.  |  | REGULAR       | Payment\
            \ sub type regular/common payment.                           |  | PRINCIPAL     | Payment type sub type is PRINCIPAL.\
            \                                |  | PAYOFF        | Paying Off the Loan Balance.                           \
            \            | | INST          | SEPA Instant paymen. Only valid with PaymentType == SEPA.          |\n  <br>\n"
          example: REGULAR
    GenericTransactionOrderField:
      type: object
      required:
      - fieldId
      - fieldOrderNo
      - active
      - textId
      properties:
        fieldId:
          type: string
          maxLength: 32
          description: A unique identifier (UUID) for a field in a generic transaction order. It should not be displayed to
            the customer but used to identifiy a certain field
          example: 228A57E6FCE947BCB26A7DD516A24959
        fieldOrderNo:
          type: integer
          description: Defines order id of that field. Each field have a unique field order id. The mobile client or web view
            should arrange the fields according to their field numbers.
          example: 1
        active:
          type: boolean
          description: Defines if the field is 'active'.
          example: true
        textId:
          type: string
          maxLength: 50
          description: Contains the text id, which is used to get the correct translatio out of the languageProperties of
            the  generic transaction order the field belongs to.
          example: no_of_checkbooks
        inputType:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: The input type of the input field as specified | Value | meaning       | |   1   | NUMERIC       |
            |   2   | ALPHA_NUMERIC | |   3   | OPTION        |
          example: 1
        selectOptions:
          type: string
          maxLength: 250
          description: '''Contains the possible, selectable options of an options field as json object (array). This a value
            should only be used as long as the inputType is 3 (OPTION). The language specific value has to be picked up by
            the UI according the users UI language from the language properties of the generic order.'''
          example: '["shipping_option_Home_address","shipping_option_Branch_pickup"]'
    GenericTransactionOrderRequestField:
      type: object
      required:
      - fieldId
      - fieldValue
      properties:
        fieldId:
          type: string
          maxLength: 32
          description: A unique identifier (UUID) for a field in a generic transaction order. It should not be displayed to
            the customer but used to identifiy a certain field
          example: 228A57E6FCE947BCB26A7DD516A24959
        fieldValue:
          type: string
          maxLength: 255
          description: 'Contains the (user input) value of that field. Allowed characters are: ^([\s]*[a-zA-Z0-9]*[\s_.''-ßöÖäÄüÜ$€?!:;@]?[,]?)*$'
          example: '1'
    GenericTransactionOrder:
      type: object
      required:
      - genericTransactionOrderId
      - genericTransactionOrderTypeId
      - shippingAddress
      - languageProperties
      - fields
      properties:
        genericTransactionOrderId:
          type: string
          maxLength: 32
          description: A unique identifier (UUID) for generic transaction order type. It should not be displayed to the customer
            but used to identifiy a certain generic transaction order type
          example: 228A57E6FCE947BCB26A7DD516A24959
        genericTransactionOrderTypeId:
          type: string
          maxLength: 50
          description: A symbolic name for that generic transaction order type.
          example: Checkbook
        shippingAddress:
          type: string
          maxLength: 100
          description: The address where the result/outcome of that generic transaction order should be shipped to.
          example: 26 Shelly Lane, Bella Vista, Arkansas, USA
        languageProperties:
          type: string
          maxLength: 2000
          description: A JSON object, which contains the language properties.
          example: '{"de":{"shipping_option_Home_address":"Postanschift","no_of_checks":"Anzahl Schecks pro Buch","shipping_option_Branch_pickup":"Filialabholung","Checkbook":"Scheck-Buch","no_of_checkbooks":"Anzahl
            Scheckbücher","shipping_option":"Versandoptionen"},"en":{"shipping_option_Home_address":"Home address","no_of_checks":"No
            of checks per book","shipping_option_Branch_pickup":"Branch pickup","Checkbook":"Checkbook","no_of_checkbooks":"No
            of checkbooks","shipping_option":"Shipping options"}}'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/GenericTransactionOrderField'
          description: The fields of that order type.
    CreditorData:
      type: object
      required:
      - paymentCode
      - paymentSubCode
      - paymentType
      - creditorId
      properties:
        paymentCode:
          type: string
          maxLength: 20
          description: A unique identifier for the payment code
          example: '32435545'
        paymentSubCode:
          type: string
          maxLength: 20
          description: A unique identifier for the payment sub code
          example: '32435545'
        description:
          type: string
          maxLength: 255
          description: A description
          example: A description of a creditor.
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        billerNetworkId:
          type: string
          maxLength: 20
          description: The biller network Id.
          example: '32435545'
        institution:
          type: string
          maxLength: 40
          description: Institution of the creditor.
          example: '32435545'
        partialPaymentsAllowed:
          type: boolean
          description: Is set to true, if partial payments are allowed for this creditor.
          example: false
        active:
          type: boolean
          description: Is set to true, if this creditor is active/can be used.
          example: true
        paymentGroup:
          type: string
          maxLength: 70
          description: The payment group of the creditor.
          example: Payment group
        creditorId:
          type: string
          maxLength: 255
          description: A unique identifier for the creditor
          example: '32435545'
        additionalFields:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalCreditorFieldDescription'
    SinglePaymentOrderResponseData:
      type: object
      properties:
        sourceAccount:
          $ref: '#/components/schemas/ShortAccountInfo'
        targetAccount:
          $ref: '#/components/schemas/ShortAccountInfo'
        requestedAmount:
          $ref: '#/components/schemas/Amount'
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        paymentSubType:
          $ref: '#/components/schemas/PaymentSubType'
        usageText:
          type: string
          maxLength: 255
          description: The usage text message.
          example: Invoice# 2273355A
        senderName:
          type: string
          maxLength: 255
          description: The name of the sender.
          example: A. Rich. Guy
        receiverName:
          type: string
          maxLength: 255
          description: The name of the receiver.
          example: A. Poor Guy
        orderId:
          type: string
          maxLength: 255
          description: An optional field for an orderId or somethimg like that.
          example: Order# 9832327A565
        referenceNumber:
          type: string
          maxLength: 255
          description: An optional field for an reference num,ber or somethimg like that.
          example: Reference# 935546655
        scheduledDate:
          $ref: '#/components/schemas/OmapiDate'
    Location:
      type: object
      required:
      - locationId
      - status
      - latitude
      - longitude
      properties:
        locationId:
          type: string
          maxLength: 255
          description: A unique identifier for a ATM, Branch, ...
          example: '32435545'
        type:
          $ref: '#/components/schemas/WorkstationType'
        status:
          $ref: '#/components/schemas/WorkstationStatus'
        address:
          $ref: '#/components/schemas/Address'
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: 'The latitude of the location. Format: DD.dddd. Range form -90.000000 to +90.000000'
          example: 51.367043
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: 'The longitude of the location. Format: DDD.dddd. Range form -180.000000 to +180.000000'
          example: 12.481767
        supportedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/GetLocationsTransactionConstants'
    Transaction:
      type: object
      required:
      - amount
      - transactionDate
      - transactionComments
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        sourceAccount:
          $ref: '#/components/schemas/OmApiAccountRef'
        targetAccount:
          $ref: '#/components/schemas/OmApiAccountRef'
        referenceId:
          type: string
          maxLength: 255
          description: The reference Id, if there is any aka. <b>primanota</b>
          example: '87536789'
        transactionID:
          type: string
          maxLength: 255
          description: The transaction Id, if there is any.
          example: '97536789'
        transactionDate:
          type: string
          pattern: ([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))
          description: 'The date when the transaction was executed, if the transaction is part of a getTransactionsResponse.

            The date at which the transaction should be executed, if the transaction is part of the response to a getScheduledTransactionsRequest.

            The date pattern is defined "YYYY-MM-DD", with YYYY as 4-digit year, MM as 2-digit month and DD as 2-digit day
            of month.

            As defined by date-time - RFC3339

            Please see: https://tools.ietf.org/html/rfc3339

            An example of a valid date is: 2017-01-31

            '
          example: '2017-01-31'
        transactionComments:
          type: string
          maxLength: 255
          example: Thanks for your credit.
    ScheduledTransaction:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        fromAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        fromAccountType:
          type: string
          maxLength: 255
          description: The source account type.
        toAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        toAccountType:
          type: string
          maxLength: 255
          description: The beneficiary account type.
        referenceId:
          type: string
          maxLength: 255
          description: The reference Id, if there is any aka. <b>primanota</b>
          example: '87536789'
        transactionID:
          type: string
          maxLength: 255
          description: The transaction Id, if there is any.
          example: '97536789'
        transactionType:
          type: string
          maxLength: 255
          description: The type of the transaction (Fiserv and Fiserv DNA only)
        nextTransactionDate:
          type: string
          pattern: ([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))
          description: 'The date at which the transaction should be executed.

            The date pattern is defined "YYYY-MM-DD", with YYYY as 4-digit year, MM as 2-digit month and DD as 2-digit day
            of month.

            As defined by date-time - RFC3339

            Please see: https://tools.ietf.org/html/rfc3339

            An example of a valid date is: 2017-01-31

            '
          example: '2017-01-31'
        lastTransactionDate:
          type: string
          pattern: ([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))
          description: 'The date at which the transaction was last executed.

            The date pattern is defined "YYYY-MM-DD", with YYYY as 4-digit year, MM as 2-digit month and DD as 2-digit day
            of month.

            As defined by date-time - RFC3339

            Please see: https://tools.ietf.org/html/rfc3339

            An example of a valid date is: 2017-01-31

            '
          example: '2017-01-31'
        transactionComments:
          type: string
          maxLength: 255
          example: Thanks for your credit.
        frequency:
          type: string
          maxLength: 255
    PrestagedTransactionData:
      description: Data of a prestaged transaction as returned when an overdraft confirmation is requested
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        fromAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        fromAccountType:
          type: string
          maxLength: 255
          description: The source account type.
        transactionID:
          type: string
          maxLength: 255
          description: The transaction Id, if there is any.
          example: '97536789'
        validFromDate:
          type: string
          pattern: ([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))
          description: 'The date from which the prestaged transaction is valid.

            The date pattern is defined "YYYY-MM-DD", with YYYY as 4-digit year, MM as 2-digit month and DD as 2-digit day
            of month.

            As defined by date-time - RFC3339

            Please see: https://tools.ietf.org/html/rfc3339

            An example of a valid date is: 2017-01-31

            '
          example: '2017-01-31'
        validToDate:
          type: string
          pattern: ([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))
          description: 'The date until the prestaged transaction is valid.

            The date pattern is defined "YYYY-MM-DD", with YYYY as 4-digit year, MM as 2-digit month and DD as 2-digit day
            of month.

            As defined by date-time - RFC3339

            Please see: https://tools.ietf.org/html/rfc3339

            An example of a valid date is: 2017-01-31

            '
          example: '2017-01-31'
    RequestedTransactionData:
      description: Data of a requested scheduled transactions (formerly known as turnover position) from backend host as returned
        when an overdraft confirmation is requested
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        fromAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        fromAccountType:
          type: string
          maxLength: 255
          description: The source account type.
        referenceId:
          type: string
          maxLength: 255
          description: The reference Id, if there is any aka. <b>primanota</b>
          example: '87536789'
        valueDate:
          type: string
          pattern: ([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))
          description: 'The transaction date.

            The date pattern is defined "YYYY-MM-DD", with YYYY as 4-digit year, MM as 2-digit month and DD as 2-digit day
            of month.

            As defined by date-time - RFC3339

            Please see: https://tools.ietf.org/html/rfc3339

            An example of a valid date is: 2017-01-31

            '
          example: '2017-01-31'
        entryText:
          type: string
          maxLength: 255
          example: Thanks.
    StandingOrder:
