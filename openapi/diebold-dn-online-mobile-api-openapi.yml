    cancelPushPaymentResponse:
      description: Returns the response status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CancelPushPaymentResponse'
    getPullPaymentResponse:
      description: Returns the response status.
      content:
        application/json:
