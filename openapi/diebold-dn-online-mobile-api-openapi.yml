      properties:
        mobileDeviceType:
          $ref: '#/components/schemas/MobileDeviceType'
        deviceToken:
          type: string
          minLength: 8
          description: "The base64 encoded device identifier, which is send to Apple Push Notification Service (APNS) or Google\
            \ Cloud Messaging Service (Firebase/GCM). <br> If the device is an Android device, please see: https://firebase.google.com/docs/cloud-messaging/android/client<br>\n\
            \ For Apple devices, please see: https://developer.apple.com/library/archive/documentation/NetworkingInternet/Conceptual/RemoteNotificationsPG/HandlingRemoteNotifications.html#//apple_ref/doc/uid/TP40008194-CH6-SW1<br>\n\
            \ The deviceToken is expected to be a base64-encoded string, since the native deviceToken on a mobile device,\
            \ such as Apple devices, is a bunch of binary data."
          example: hNpl+kKYBLZl1JMGOCiKxBK/lzRDasJkRVSp6D81hqk=
        applicationId:
          type: string
          minLength: 6
          description: Please provide a unique device and application specific identifier. <br> This identifier is used to
            identify __this__ device and the coresponding application on __that__ device in the TM database.  The applicationId
            sould be the same in all calls of a certain mobile device and the coresponding application.  For iOS it is the
            bundle identifier, such as de.wincor.MobileBankingDemoApp, which you can get by calling [[NSBundle mainBundle]
            bundleIdentifier];
          example: de.wincor.MobileBankingDemoApp
        displayName:
          type: string
          minLength: 6
          description: This string is used to display a human readable form of the applicationId.<br> This is useful, for
            example, when notifications are to be assigned to this application on this device in an administrative, manual
            process.
