              hostResponseData:
                $ref: '#/components/schemas/HostResponseData'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    transferReversalResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            properties:
              confirmationNumber:
                $ref: '#/components/schemas/ConfirmationNumber'
              hostResponseData:
                $ref: '#/components/schemas/HostResponseData'
              fromAccountDetails:
                $ref: '#/components/schemas/AccountInformationBase'
              toAccountDetails:
                $ref: '#/components/schemas/AccountInformationBase'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    AccountName:
      type: string
      description: The account name which is displayed to the user
      example: Your Savings account
    creditRequest:
      type: object
      required:
      - pointOfInteraction
      - payload
      - transaction
      properties:
        pointOfInteraction:
          $ref: '#/components/schemas/PointOfInteraction'
        transaction:
          $ref: '#/components/schemas/TransactionWithStandin'
        payload:
          type: object
          required:
          - accountRef
          - amount
          properties:
            amount:
              $ref: '#/components/schemas/Amount'
            consumerId:
              type: string
              example: '123456'
            check:
              $ref: '#/components/schemas/CheckWithAmount'
            card:
              $ref: '#/components/schemas/CardPan'
            pin:
              $ref: '#/components/schemas/Pin'
            remark:
              type: string
              description: Transaction comments
              example: Transaction remark
            clearingCategoryCode:
              $ref: '#/components/schemas/ClearingCategoryCode'
            type:
              $ref: '#/components/schemas/PaymentSubType'
            valueDate:
              $ref: '#/components/schemas/ValueDate'
            fundTypeCode:
              $ref: '#/components/schemas/FundTypeCode'
            cashBoxNumber:
              type: string
              description: Cash Box Number
              example: '1234'
            accountRef:
              $ref: '#/components/schemas/AccountRef'
            fee:
              $ref: '#/components/schemas/TransactionFeeAmountOnly'
            additionalProperties:
              $ref: '#/components/schemas/AdditionalProperties'
            supplementaryData:
              $ref: '#/components/schemas/SupplementaryData'
    TransactionWithStandin:
      type: object
      allOf:
      - $ref: '#/components/schemas/TransactionBase'
      - type: object
        properties:
          isStandin:
            $ref: '#/components/schemas/IsStandin'
    TransactionFeeAmountOnly:
      type: object
      required:
      - amount
      properties:
        amount:
          type: object
          description: "The fee amount for this transaction. Always an unsigned value. \n\nThe value in this field is just for information purpose. It is already included in calculations for the 'amount' field.\n"
          required:
          - value
          - currency
          properties:
            value:
              description: The amount value of the given currency.
              type: string
              pattern: '[0-9]{1,13}\.[0-9]{1,3}'
              minimum: 0
              example: '2.00'
            currency:
              description: Currency code
              type: string
              minLength: 3
              pattern: '[A-Z]{3,3}'
              example: USD
    transferConfirmationResponseUpdatedBalance:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            properties:
              confirmationNumber:
                $ref: '#/components/schemas/ConfirmationNumber'
              hostResponseData:
                $ref: '#/components/schemas/HostResponseData'
              fromAccountDetails:
                $ref: '#/components/schemas/AccountInformationBase'
              toAccountDetails:
                $ref: '#/components/schemas/AccountInformationBase'
              transaction:
                $ref: '#/components/schemas/TransactionResponse'
              additionalProperties:
                $ref: '#/components/schemas/AdditionalProperties'
              supplementaryData:
                $ref: '#/components/schemas/SupplementaryData'
    PointOfInteraction:
      properties:
        clientId:
          type: string
          description: Client Id
          example: '123'
        clientType:
          $ref: '#/components/schemas/ClientType'
        institutionId:
          type: string
          description: The id of the institute
          example: '1234'
        tellerId:
          type: string
          description: The id of the teller
          example: ''
        branchCode:
          type: string
          description: Branch code
          example: ''
        clientTransactionDate:
          $ref: '#/components/schemas/ClientTransactionDate'
        clientTransactionTime:
          $ref: '#/components/schemas/ClientTransactionTime'
        channel:
          $ref: '#/components/schemas/Channel'
        address:
          $ref: '#/components/schemas/AddressPOI'
        networkId:
          $ref: '#/components/schemas/NetworkId'
        merchantCategory:
          $ref: '#/components/schemas/MerchantCategory'
    AccountType:
      type: string
      enum:
      - UNSPECIFIED
      - GIRO
      - SAVINGS
      - SECURITIES_DEPOSIT
      - SAVINGS_SECURITIES_DEPOSIT
      - GIRO_SECURITIES_DEPOSIT
      - FIXED_TERM_DEPOSIT
      - CREDIT_CARD
      - LOAN
      - MORTGAGE
      - FOREIGN_CURRENCY
      - EXTERNAL
      - CHECKING
      - UNIVERSAL
      - SPENDING_POWER
      - FEE_COLLECTION_ACCOUNT
      - ATM
      - VENDOR
      - SHAREHOLDER
      - GENERAL_LEDGER
      - CASH_RESERVE
      - LOAN_DENIAL
      - LEASE
      - CONSUMER_LOAN
      - COMMERCIAL_LOAN
      - RETIREMENT_LOAN
      - EXTERNAL_LOAN
      - SHARE
      - INDIVIDUAL_RETIREMENT
      - CARD_PAN
      - HEALTH_SAVINGS
      - CREDIT
      - CREDIT_LINE
      - CERTIFIED_DEPOSIT
      - INSTALLMENT
      - OTHER
      - DEFAULT_INVESTMENT_ACCOUNT
      - CASH_BENEFIT
      - OTHER_LOAN
      - DEBIT_CARD
      - DEFERRED_DEBIT_CARD
      - CHARGE_ACCOUNT
      - PREPAID
      - EMPLOYEE_BENEFIT
      example: SAVINGS
      description: '| Symbolic name              | Comment                                                        | |----------------------------|----------------------------------------------------------------| | UNSPECIFIED                | Default value for unknown accounts.                              | | GIRO                       | Giro account.                                                  | | SAVINGS                    | Savings account.  | SECURITIES_DEPOSIT         | Depot of securities (shares and so on).                        | | SAVINGS_SECURITIES_DEPOSIT | Savings securities.                                            | | GIRO_SECURITIES_DEPOSIT    | Giro securities.                                               | | FIXED_TERM_DEPOSIT         | Fixed term deposit.                                            | | CREDIT_CARD                | Credit card account. (ISO 8583; MC DE.54->30 / VISA DE.54->30).| | LOAN                       | An account that covers a credit and its balance and movements. | | MORTGAGE                   | Security for a loan.                                           | | FOREIGN_CURRENCY           | An account that holds money in a foreign curreny.              | | EXTERNAL                   | An account that represents an account of a foreign institution.| | CHECKING                   | Checking account. (ISO 8583; MC DE.54->20 / VISA DE.54->20)    |  | UNIVERSAL                  | ISO 8583; VISA DE.54->40)                                      |  | SPENDING_POWER             | ISO 8583; VISA DE.54->64)                                      |  | FEE_COLLECTION_ACCOUNT     | used to collect fees                                           |  | ATM                        | ATM                                                            | | VENDOR                     | Vendor                                                         | | SHAREHOLDER                | Shareholder                                                    | | GENERAL_LEDGER             | General ledger                                                 | | CASH_RESERVE               | Cash Reserve Line of Credit                                    | | LOAN_DENIAL                | Load denial                                                    | | LEASE                      | Lease                                                          | | CONSUMER_LOAN              | Consumer loan                                                  | | COMMERCIAL_LOAN            | Cemercial loan                                                 | | RETIREMENT_LOAN            | Retirement loan                                                | | EXTERNAL_LOAN              | External loan                                                  | | SHARE                      | Share                                                          | | INDIVIDUAL_RETIREMENT      | Individual Retirement Account(IRA)                             |'
    ValueDate:
      type: string
      description: Refers to some future point in time at which the value of an account or transaction becomes effective
      example: '2020-07-23'
    CheckWithAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/Check'
      - type: object
        properties:
          checkAmount:
            $ref: '#/components/schemas/Amount'
    AccountSubType:
      description: Represents the SubType of an account for AccountType
      type: string
      example: Savings account
    ResponseCode:
      type: string
      enum:
      - OK
      - FAIL
      - RESUBMIT
      example: OK
  parameters:
    referenceId:
      name: referenceId
      in: header
      description: Unique identifier for the transaction request.
      required: true
      schema:
        type: string
        example: A123F34
    initiatingPartyName:
      name: initiatingPartyName
      in: header
      description: The name of the initiating party.
      required: true
      schema:
        type: string
        minLength: 1
        example: DieboldNixdorf
    version:
      name: version
      in: header
      description: Version of DN Open Backend API being used.
      required: true
      schema:
        type: string
        minLength: 1
        example: 4.3.0
    initiatingPartyId:
      name: initiatingPartyId
      in: header
      description: Identifier of the party that has initiated this transaction, in this case Diebold Nixdorf's ID.
      required: true
      schema:
        type: string
        minLength: 1
        example: DieboldNixdorf
    authorization:
      name: Authorization
      in: header
      description: 'In case the Authentication type is BASIC_AUTH, Authorization will contain base 64 encoded userName:password string using HTTP Basic Authentication.<br> In case the Authentication Type is JWE/TOKEN, Authorization will contain token received using getToken request as Bearer Token. '
      schema:
        type: string
        example: Basic afae1wad213da OR Bearer T2131241
    timestamp:
      name: timestamp
      in: header
      description: timestamp of the transaction
      required: true
      schema:
        type: string
        format: yyyy-MM-dd'T'HH:mm:ssZ
        description: Timestamp
        example: 2020-09-01T16:40:52+0000
    productName:
      name: productName
      in: header
      description: The name of the product which is consuming the service (business product name).
      required: true
      schema:
        type: string
        minLength: 1
        example: Transaction Middleware
  examples:
    ServiceResponseFailExample:
      value:
        responseCode: FAIL
        extendedResponse:
          code: SERVER_FAILURE
          message: SERVER_FAILURE
  securitySchemes:
    basic:
      type: http
      description: Authorization will contain base 64 encoded userName:password string
      scheme: basic
    bearer:
      type: http
      description: Authorization will contain token received using getToken request as Bearer Token
      scheme: bearer
      bearerFormat: Any string
    jweBearer:
      type: http
      description: Authorization will contain Bearer encryptedJWT. JWT will be encrypted with backend endpoint public key
      scheme: bearer
      bearerFormat: Any string
externalDocs:
  url: /docs
  description: Find more information here
