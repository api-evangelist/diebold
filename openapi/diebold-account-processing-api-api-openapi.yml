      type: object
      required:
      - value
      - currency
      properties:
        value:
          description: The amount value of the given currency.
          type: string
          pattern: '[0-9]{1,13}\.[0-9]{1,3}'
          minimum: 0
          example: '100.00'
        currency:
          description: Currency code
          type: string
          minLength: 3
          pattern: '[A-Z]{3,3}'
          example: USD
    Check:
      type: object
