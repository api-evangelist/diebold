openapi: 3.2.0
info:
  title: DN Online & Mobile Prestaged Transaction API
  description: Diebold Nixdorf Online & Mobile API.
  version: 3.2.1
  contact:
    name: Diebold Nixdorf
    email: info.de@dieboldnixdorf.com
servers:
- url: http://localhost:8080/tm-om-api/v4
  description: Transaction Middleware (VTE) 3.0+
- url: https://localhost:8080/tm-om-api/v4
  description: Transaction Middleware (VTE) 3.0+
security:
- bearerAuth: []
tags:
- name: Prestaged Transaction API
paths:
  /createCashout4Me:
    post:
      tags:
      - Prestaged Transaction API
      summary: Create a prestaged cashout (withdrawal) transaction
      description: 'Create a prestaged cashout (withdrawal) transaction request. The server creates the transaction if the request can be validated and processed successfully. It is mapped to the consumerId and has a configurable lifetime after which the transaction expires (via OCM). To execute the transaction at an ATM or with a contact-less mobile application (see __/executePrestagedTransaction__) an accessCode is returned in the response. Optionally this code can be sent by Email or SMS.


        The request data payload is described by the __CreateCashout4MeRequestPayload__ schema.


        When the transaction was created successfully the server returns details about the transaction (see __CreateCashout4MeResponsePayload__).

        ### Example Response:


        {

        "responseStatus": {

        "success": true,

        "error": null

        },

        "cryptoEnvelope": {

        "keyParams": null,

        "payload": "1Dbp80MYqQ/z3+dzIVqxBhHXg6Awu/S1XVbK7OcbHZCw5ubyMrv4TjZLq5+U6bvtiRBWFeitgcWWb8Ng+TjOWQ=="

        }

        }


        __Using RSA/AES:__

        The server generates an AES key (256 bit) and iv (128 bit) to encrypt the response payload. After the payload encryption the key parameters are encrypted with the client''s public RSA key (see __clientSecretparam__). The encrypted key parameters and payload are stored in a __CryptoEnvelope__ entity that is attached to the response body.


        __Using ECIES:__

        The server uses the client''s EC public key (see __clientSecretParam__) to encrypt the response payload. The encrypted payload is stored in a __CryptoEnvelope__ entity that is attached to the response body.'
      operationId: createCashout4Me
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      requestBody:
        $ref: '#/components/requestBodies/createCashout4MeRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/createCashout4MeResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /createCashout2You:
    post:
      tags:
      - Prestaged Transaction API
      summary: Create a prestaged cash out transaction request
      description: 'Create a prestaged cashout (withdrawal) transaction request. The server creates the transaction if the request can be validated and processed successfully. It is mapped to the consumerId and has a configurable lifetime after which the transaction expires (via OCM). To execute the transaction at an ATM or with a contact-less mobile application (see __/executePrestagedTransaction__) an accessCode is created and sent to a third party member. This step is __not__ optional for this request type. The accessCode can be sent by Email or SMS.


        The request data payload is described by the __CreateCashout2YouRequestPayload__ schema.


        When the transaction was created successfully the server returns details about the transaction (see __CreateCashout2YouResponsePayload__).


        ### Example Response:


        {

        "responseStatus": {

        "success": true,

        "error": null

        },

        "cryptoEnvelope": {

        "keyParams": null,

        "payload": "1Dbp80MYqQ/z3+dzIVqxBhHXg6Awu/S1XVbK7OcbHZCw5ubyMrv4TjZLq5+U6bvtiRBWFeitgcWWb8Ng+TjOWQ=="

        }

        }


        __Using RSA/AES:__

        The server generates an AES key (256 bit) and iv (128 bit) to encrypt the response payload. After the payload encryption the key parameters are encrypted with the client''s public RSA key (see __clientSecretparam__). The encrypted key parameters and payload are stored in a __CryptoEnvelope__ entity that is attached to the response body.


        __Using ECIES:__

        The server uses the client''s EC public key (see __clientSecretParam__) to encrypt the response payload. The encrypted payload is stored in a __CryptoEnvelope__ entity that is attached to the response body.'
      operationId: createCashout2You
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      requestBody:
        $ref: '#/components/requestBodies/createCashout2YouRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/createCashout2YouResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /createDeposit:
    post:
      tags:
      - Prestaged Transaction API
      summary: Create a prestaged cashin/deposit transaction request
      description: '## Creating a prestaged cashin/deposit transaction request.'
      operationId: createDeposit
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      requestBody:
        $ref: '#/components/requestBodies/createDepositRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/createDepositResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /createBranchDeposit:
    post:
      tags:
      - Prestaged Transaction API
      summary: Create a prestaged deposit transaction request
      description: 'Create a branch based prestaged deposit transaction request. The server creates the transaction if the request can be validated and processed successfully. It is mapped to the consumerId and has an __infinite__ lifetime. To execute the transaction at a Cash-Recycler ATM or with a contact-less mobile application (see __/executePrestagedTransaction__) an accessCode is created and sent to a third party member. This step is __not__ optional for this request type. The accessCode can be sent by Email or SMS.


        When the transaction was created successfully the server returns details about the transaction (see __CreateBranchDepositResponsePayload__).

        ### Example Response:


        {

        "responseStatus": {

        "success": true,

        "error": null

        },

        "cryptoEnvelope": {

        "keyParams": null,

        "payload": "1Dbp80MYqQ/z3+dzIVqxBhHXg6Awu/S1XVbK7OcbHZCw5ubyMrv4TjZLq5+U6bvtiRBWFeitgcWWb8Ng+TjOWQ=="

        }

        }


        __Using RSA/AES:__

        The server generates an AES key (256 bit) and iv (128 bit) to encrypt the response payload. After the payload encryption the key parameters are encrypted with the client''s public RSA key (see __clientSecretparam__). The encrypted key parameters and payload are stored in a __CryptoEnvelope__ entity that is attached to the response body.


        __Using ECIES:__

        The server uses the client''s EC public key (see __clientSecretParam__) to encrypt the response payload. The encrypted payload is stored in a __CryptoEnvelope__ entity that is attached to the response body.'
      operationId: createBranchDeposit
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      requestBody:
        $ref: '#/components/requestBodies/createBranchDepositRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/createBranchDepositResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /deletePrestagedTransaction:
    post:
      tags:
      - Prestaged Transaction API
      summary: Delete existing prestaged transactions
      description: 'Delete a prestaged transaction with the given __referenceID__ (see __referenceIdParam__). The transaction can be of any kind of the supported prestaged transactions.

        ### Example Response:


        {

        "responseStatus": {

        "success": true,

        "error": null

        }

        }'
      operationId: deletePrestagedTransaction
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      - $ref: '#/components/parameters/referenceIdParam'
      responses:
        '200':
          $ref: '#/components/responses/deletePrestagedTransactionResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /getPrestagedTransactions:
    get:
      tags:
      - Prestaged Transaction API
      summary: Returns a list of all prestaged transactions for the given consumerId
      description: 'Returns a list of all prestaged transactions for the given consumerId (see __GetPrestagedTransactionsResponsePayload__).

        ### Example Response:


        {

        "responseStatus": {

        "success": true,

        "error": null

        },

        "cryptoEnvelope": {

        "keyParams": null,

        "payload": "1Dbp80MYqQ/z3+dzIVqxBhHXg6Awu/S1XVbK7OcbHZCw5ubyMrv4TjZLq5+U6bvtiRBWFeitgcWWb8Ng+TjOWQ=="

        }

        }


        __Using RSA/AES:__

        The server generates an AES key (256 bit) and iv (128 bit) to encrypt the response payload. After the payload encryption the key parameters are encrypted with the client''s public RSA key (see __clientSecretparam__). The encrypted key parameters and payload are stored in a __CryptoEnvelope__ entity that is attached to the response body.


        __Using ECIES:__

        The server uses the client''s EC public key (see __clientSecretParam__) to encrypt the response payload. The encrypted payload is stored in a __CryptoEnvelope__ entity that is attached to the response body.'
      operationId: getPrestagedTransactions
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      - $ref: '#/components/parameters/bankCodeParam'
      - $ref: '#/components/parameters/accountNumberParam'
      - $ref: '#/components/parameters/accountTypeParam'
      responses:
        '200':
          $ref: '#/components/responses/getPrestagedTransactionsResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
  /executePrestagedTransaction:
    post:
      tags:
      - Prestaged Transaction API
      summary: Execute a prestaged transaction at an ATM with an accessCode
      description: 'Execute a prestaged transaction at an ATM with an accessCode. When the customer creates a prestaged transaction or receives an accessCode from a third party member, the transaction (deposit/withdrawal) tied to that accessCode can be executed contact-less at an ATM supporting the feature. The ATM presents a QR-Code that must be scanned by the mobile application. It contains a JSON Web Token (JWT) with information like the ATM''s __nodeId__ and a __tokenUUID__ which both have to be provided in the request together with the __accessCode__ (see __ExecutePrestagedTransactionRequestPayload__).


        When two-step-verification is enabled (via OCM) the first request is denied with a RESUBMIT / TWO_STEP_ATM_VALIDATION_REQUIRED response. The ATM will flash lights or play a sound to indicate that the transaction is going to be executed at the ATM next to the customer. The customer then verifies by setting the __additionalSecurity__ property to true. Ideally the customer is guided through the process by his mobile banking application.

        ### Example Response:


        {

        "responseStatus": {

        "success": true,

        "error": null

        }

        }'
      operationId: executePrestagedTransaction
      parameters:
      - $ref: '#/components/parameters/clientSecretParam'
      - $ref: '#/components/parameters/sessionTokenParam'
      - $ref: '#/components/parameters/consumerIdParam'
      - $ref: '#/components/parameters/bankCodeParam'
      requestBody:
        $ref: '#/components/requestBodies/executePrestagedTransactionRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/executePrestagedTransactionResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        default:
          $ref: '#/components/responses/defaultResponse'
components:
  schemas:
    CreateBranchDepositResponse:
      type: object
      required:
      - responseStatus
      description: The response data is contained in the __CryptoEnvelope__'s property __payload__ as encrypted and stringified JSON object using the schema __CreateBranchDepositResponsePayload__
      properties:
        responseStatus:
          $ref: '#/components/schemas/ResponseBase'
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    ResponseBase:
      description: "Every number used by OM-API is within a certain number range.<br> The OM-API V4 number range is 2870000 - 2879999.<br> Within that range, every requests group has its number range of 1000: <br>\n  | Request Group | Number Range                       |\n  |---------------|------------------------------------|\n  | Account Management API          | 2870000-2870999  |\n  | Standing Order API              | 2871000-2871999  |\n  | Prestaged Transaction API       | 2872000-2872999  |\n  | Miscellaneous API               | 2873000-2873999  |\n  | Accessibility API               | 2874000-2874999  |\nWithin each group range, every belonging request has its number range of 100:\n  <br>\n  | Request Name  | Number Range                       |\n  |---------------|------------------------------------|\n  | *Account Management API*\n  | getAccounts                     | 2870000-2870099  |\n  | getAccountTypes                 | 2870100-2870199  |\n  | getAccountDetails               | 2870200-2870299  |\n  | getTransactions                 | 2870300-2870399  |\n  | getScheduledTransactions        | 2870400-2870499  |\n  | checkAccount                    | 2870500-2870599  |\n  | createTransfer                  | 2870600-2870699  |\n  | createDispute                   | 2870700-2870799  |\n  | &nbsp;\n  | *Standing Order API*\n  | getStandingOrders               | 2871000-2871099  |\n  | createStandingOrder             | 2871100-2871199  |\n  | updateStandingOrder             | 2871200-2871299  |\n  | deleteStandingOrder             | 2871300-2871399  |\n  | updateAccountNickname           | 2871400-2871499  |\n  | &nbsp;\n  | *Prestaged Transaction API*\n  | createCashout4Me                | 2872000-2872099  |\n  | createCashout2You               | 2872100-2872199  |\n  | createDeposit                   | 2872200-2872299  |\n  | createBranchDeposit             | 2872300-2872399  |\n  | deletePrestagedTransaction      | 2872400-2872499  |\n  | getPrestagedTransactions        | 2872500-2872599  |\n  | executePrestagedTransaction     | 2872600-2872699  |\n  | &nbsp;\n  | *Miscellaneous API*\n  | getCreditors                    | 2874000-2874099  |\n  | getSinglePaymentOrderData       | 2874100-2874199  |\n  | getPreferences                  | 2874200-2874299  |\n  | setPreferences                  | 2874300-2874399  |\n  | getClientBranding               | 2874400-2874499  |\n  | getGenericTransactionOrders     | 2874500-2874599  |\n  | performGenericTransactionOrder  | 2874600-2874699  |\n  | getLocations                    | 2874700-2874799  |\n  | &nbsp;\n  | *Accessibility API*\n  | getRsaKey                       | 2875000-2875099  |\n  | getEcKey                        | 2875100-2875199  |\n  | getVersion                      | 2875200-2875299  |\n  <br>\n  The numbers in the ranges are used primarily for the error codes (see Error schema)."
      type: object
      required:
      - success
      properties:
        success:
          description: 'Returns True or False to indicate the success of the API call.

            The The error property is optional.

            It is set only if an error has been detected.

            '
          type: boolean
          example: true
        error:
          $ref: '#/components/schemas/Error'
    CreateCashout2YouResponse:
      type: object
      required:
      - responseStatus
      description: The response data is contained in the __CryptoEnvelope__'s property __payload__ as encrypted and stringified JSON object using the schema CreateCashout2YouResponsePayload__
      properties:
        responseStatus:
          $ref: '#/components/schemas/ResponseBase'
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    CreateBranchDepositRequest:
      type: object
      required:
      - cryptoEnvelope
      description: "With OM-API v3 encryption is used for all endpoints. The request body is therefore specified to contain only on property, the __CryptoEnvelope__:\n\n  CryptoEnvelope:\n    type: object\n    required:\n      - payload\n    description: >-\n      Object holding cryptographically secured request properties.\n    properties:\n      payload:\n        type: string\n        minLength: 1\n        example: BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+\n\nThe __CryptoEnvelope__ has a __payload__ property which represents an encrypted JSON string of the actual request object which is specified by  the schema __CreateBranchDepositRequestPayload__."
      properties:
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    GetPrestagedTransactionsResponse:
      type: object
      required:
      - responseStatus
      description: The response data is contained in the __CryptoEnvelope__'s property __payload__ as encrypted and stringified JSON object using the schema __GetPrestagedTransactionsResponsePayload__
      properties:
        responseStatus:
          $ref: '#/components/schemas/ResponseBase'
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    AesKeyParams:
      description: A holder object for AES symmetric key params.
      required:
      - key
      - iv
      properties:
        key:
          description: The Base64 encoded (and encrypted) AES key (256bit).
          type: string
          example: MTI4MzI1Mjc2NTI=
        iv:
          description: The Base64 encoded (and encrypted) AES iv (128bit).
          type: string
          example: MTI4MzI1Mjc2NTI=
    ExecutePrestagedTransactionRequest:
      type: object
      required:
      - cryptoEnvelope
      description: "With OM-API v3 encryption is used for all endpoints. The request body is therefore specified to contain only on property, the __CryptoEnvelope__:\n\n  CryptoEnvelope:\n    type: object\n    required:\n      - payload\n    description: >-\n      Object holding cryptographically secured request properties.\n    properties:\n      payload:\n        type: string\n        minLength: 1\n        example: BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+\n\nThe __CryptoEnvelope__ has a __payload__ property which represents an encrypted JSON string of the actual request object which is specified by  the schema __ExecutePrestagedTransactionRequestPayload__."
      properties:
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    ExecutePrestagedTransactionResponse:
      type: object
      required:
      - responseStatus
      properties:
        responseStatus:
          $ref: '#/components/schemas/ResponseBase'
    CreateCashout2YouRequest:
      type: object
      required:
      - cryptoEnvelope
      description: "With OM-API v3 encryption is used for all endpoints. The request body is therefore specified to contain only on property, the __CryptoEnvelope__:\n\n  CryptoEnvelope:\n    type: object\n    required:\n      - payload\n    description: >-\n      Object holding cryptographically secured request properties.\n    properties:\n      payload:\n        type: string\n        minLength: 1\n        example: BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+\n\nThe __CryptoEnvelope__ has a __payload__ property which represents an encrypted JSON string of the actual request object which is specified by  the schema __CreateCashout2YouRequestPayload__."
      properties:
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    CreateDepositResponse:
      type: object
      required:
      - responseStatus
      description: The response data is contained in the __CryptoEnvelope__'s property __payload__ as encrypted and stringified JSON object using the schema __CreateDepositResponsePayload__
      properties:
        responseStatus:
          $ref: '#/components/schemas/ResponseBase'
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    CryptoEnvelope:
      type: object
      required:
      - payload
      description: Object holding a cryptographically secured request properties.
      properties:
        keyParams:
          $ref: '#/components/schemas/AesKeyParams'
        payload:
          type: string
          minLength: 1
          example: BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+
    CreateDepositRequest:
      type: object
      required:
      - cryptoEnvelope
      description: "With OM-API v3 encryption is used for all endpoints. The request body is therefore specified to contain only on property, the __CryptoEnvelope__:\n\n  CryptoEnvelope:\n    type: object\n    required:\n      - payload\n    description: >-\n      Object holding cryptographically secured request properties.\n    properties:\n      payload:\n        type: string\n        minLength: 1\n        example: BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+\n\nThe __CryptoEnvelope__ has a __payload__ property which represents an encrypted JSON string of the actual request object which is specified by  the schema __CreateDepositRequestPayload__."
      properties:
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    CreateCashout4MeRequest:
      type: object
      required:
      - cryptoEnvelope
      description: "With OM-API v3 encryption is used for all endpoints. The request body is therefore specified to contain only on property, the __CryptoEnvelope__:\n\n  CryptoEnvelope:\n    type: object\n    required:\n      - payload\n    description: >-\n      Object holding cryptographically secured request properties.\n    properties:\n      payload:\n        type: string\n        minLength: 1\n        example: BB20WIJRTz/T9vkGhETgpehzc6dDoioQ9DJV4lRA6ICaWwLPLDE+\n\nThe __CryptoEnvelope__ has a __payload__ property which represents an encrypted JSON string of the actual request object which is specified by  the schema __CreateCashout4MeRequestPayload__."
      properties:
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    DeletePrestagedTransactionResponse:
      type: object
      required:
      - responseStatus
      properties:
        responseStatus:
          $ref: '#/components/schemas/ResponseBase'
    CreateCashout4MeResponse:
      type: object
      required:
      - responseStatus
      description: The response data is contained in the __CryptoEnvelope__'s property __payload__ as encrypted and stringified JSON object using the schema __CreateCashout4MeResponsePayload__
      properties:
        responseStatus:
          $ref: '#/components/schemas/ResponseBase'
        cryptoEnvelope:
          $ref: '#/components/schemas/CryptoEnvelope'
    Error:
      type: object
      description: "The error property is optional. It is set only if an error has been detected. <p> Each request has its number range used for error codes (see ResponseBase schema). This is the list of the actual error codes for each request: <br>\n  | Request Name  | Error | Error Code  |\n  |---------------|-------|-------------|\n  | *Account Management API*\n  | &nbsp; | | |\n  | getAccounts | SERVER_FAILURE | 2870000 |\n  |               | SYSTEM_ERROR | 2870001 |\n  |               | REQUEST_DATA_INVALID | 2870002 |\n  |               | NO_RESULT | 2870003 |\n  |               | HOST_OFFLINE | 2870004 |\n  |               | HOST_COMMUNICATION_ERROR | 2870005 |\n  |               | VERIFICATION_FAILED | 2870015 |\n  | &nbsp; | | |\n  | getAccountTypes | SERVER_FAILURE | 2870100 |\n  |               | VERIFICATION_FAILED | 2870115 |\n  | &nbsp; | | |\n  | getAccountDetails | SERVER_FAILURE | 2870200 |\n  |               | SYSTEM_ERROR | 2870201 |\n  |               | REQUEST_DATA_INVALID | 2870202 |\n  |               | NO_RESULT | 2870203 |\n  |               | HOST_OFFLINE | 2870204 |\n  |               | HOST_COMMUNICATION_ERROR | 2870205 |\n  |               | VERIFICATION_FAILED | 2870215 |\n  | &nbsp; | | |\n  | getTransactions | SERVER_FAILURE | 2870300 |\n  |               | SYSTEM_ERROR | 2870301 |\n  |               | REQUEST_DATA_INVALID | 2870302 |\n  |               | NO_RESULT | 2870303 |\n  |               | HOST_OFFLINE | 2870304 |\n  |               | HOST_COMMUNICATION_ERROR | 2870305 |\n  |               | VERIFICATION_FAILED | 2870315 |\n  | &nbsp; | | |\n  | getScheduledTransactions | SERVER_FAILURE | 2870400 |\n  |               | SYSTEM_ERROR | 2870401 |\n  |               | REQUEST_DATA_INVALID | 2870402 |\n  |               | NO_RESULT | 2870403 |\n  |               | HOST_OFFLINE | 2870404 |\n  |               | HOST_COMMUNICATION_ERROR | 2870405 |\n  |               | VERIFICATION_FAILED | 2870415 |\n  | &nbsp; | | |\n  | checkAccoun