      - PAYMENT
      description: Clearing Type
      example: CASH
    ClearingState:
      type: string
      enum:
      - OK
      - NOT_SET
      - FAILED
      description: Clearing State of the inserted media
      example: OK
    HostResponseData:
      type: object
