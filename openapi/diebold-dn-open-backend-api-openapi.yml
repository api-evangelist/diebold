        remainingTotalCounter:
          type: integer
          description: counter
        level4Count:
          type: integer
          description: counter
        level3Count:
          type: integer
          description: counter
        level2Count:
          type: integer
          description: counter
        unfitCount:
          type: integer
          description: counter
        retainCount:
          type: integer
          description: counter
        rejectCounter:
          type: integer
          description: counter
        retractCounter:
          type: integer
          description: counter
    PhysicalType:
