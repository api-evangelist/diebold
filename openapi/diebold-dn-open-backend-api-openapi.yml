    CashInAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/Amount'
      description: The cash amount of the transaction
    PayableAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/Amount'
      description: The amount which may be payed on this check
    UserAmount:
