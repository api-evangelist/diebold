    ValidatedAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/Amount'
      description: Amount which has been validated
    MICRAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/Amount'
      description: Amount read from the MICR line
    CourtesyAmount:
      type: object
      allOf:
      - $ref: '#/components/schemas/Amount'
