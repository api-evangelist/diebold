            \ for information purpose. It is already included in calculations for the 'amount' field.\n"
          required:
          - value
          - currency
          properties:
            value:
              description: The amount value of the given currency.
              type: string
              pattern: '[0-9]{1,13}\.[0-9]{1,3}'
