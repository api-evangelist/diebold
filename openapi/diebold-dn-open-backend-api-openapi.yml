      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            required:
            - token
            - validity
            properties:
              token:
                type: string
                example: '123456789'
              expirationDate:
                type: string
                format: yyyy-MM-dd'T'HH:mm:ssZ
                description: Expiry timestamp of the generated token.
                example: 2030-09-23T16:40:52+0530
    getMemberBankListResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceResponse'
      - type: object
        required:
        - payload
        properties:
          payload:
            type: object
            properties:
              operation:
                type: string
                description: Defines the operation to be performed on the list of 'memberBanks'.</br></br> ADD - adds the
                  listed 'memberBanks' to existing list of member banks if not present. </br> REMOVE - removes the listed
                  'memberBanks' from existing list of member banks if present. </br></br> If unspecified, the entire list
                  of member banks is refreshed with the new list of 'memberBanks'
                enum:
                - ADD
                - REMOVE
              memberBanks:
                type: array
                items:
                  $ref: '#/components/schemas/MemberBanks'
