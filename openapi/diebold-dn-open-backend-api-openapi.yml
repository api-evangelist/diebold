      - CONSUMER_CANCEL
      - HARDWARE_ERROR
      - COMMUNICATION_ERROR
      - NOT_AUTHORIZED
      - DOOR_OPENED
      - LIMIT_EXCEEDED
      - WORKSTATION_CLOSED
      - CHIP_ERROR
      - MESSAGE_INVALID
      - HSM_STATE_INVALID
      - CARD_READ_ERROR
      - SERVER_ERROR
      - CLIENT_ERROR
      - APPLICATION_CANCEL
      - COUNTERFEIT_LIMIT_EXCEEDED
    DenomCounter:
