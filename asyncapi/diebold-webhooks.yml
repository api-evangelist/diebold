note: 'Diebold Nixdorf publishes no AsyncAPI and no event catalog, and no message broker or streaming surface appears
  anywhere in its contracts. It does publish one genuinely outbound surface, and it is recorded here rather than
  being counted as an ordinary REST API. The TM Pre-Digitization API (Outbound) describes calls that Vynamic Transaction
  Middleware MAKES to a card issuer during card digitization — its own description says the API is "used to inform
  Issuers of services being requested by, or on-behalf of, their account holders". The issuer implements these three
  endpoints; Diebold Nixdorf calls them. That is a webhook contract expressed as OpenAPI. It is not a subscription
  surface: there is no registration endpoint, no signing scheme, no retry or delivery guarantee and no replay mechanism
  documented.'
