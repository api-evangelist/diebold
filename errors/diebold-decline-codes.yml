source: Derived from the ExtendedResponseCode enums declared in the DN Open Backend, DN Account BC and DN Assist
  OpenAPI definitions, and the DetailedResponseCode enum in the DN Payment Initiation API — all harvested from the
  SwaggerHub organization Diebold-Nixdorf.
applies_to: Vynamic Transaction Middleware authorization surfaces (ATM/self-service withdrawal, deposit, transfer,
  check cashing, mixed-media payment, cardless and card-based payment).
envelope_field: extendedResponseCode (string enum), returned inside the ResponseBase alongside responseCode (OK
  | FAIL | RESUBMIT).
masking_note: Diebold Nixdorf publishes no guidance on which codes may be shown to a cardholder. These are core-banking
  authorization outcomes reaching a self-service terminal, and several (CARD_MANIPULATED, ACCOUNT_FROZEN_*, ACCOUNT_CHARGEOFF,
  PIN_TRY_LIMIT_EXCEEDED) are conventionally masked to a generic decline at the terminal — that convention is NOT
  stated in the contract and is recorded here as an unanswered question, not as provider guidance.
